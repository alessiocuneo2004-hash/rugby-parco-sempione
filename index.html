/* =====================================================================
   Rugby Parco Sempione — tema "Programma '74"
   Carta crema e navy da stampato sportivo, verde del logo come unico
   accento di azione. Titoli slab sempre maiuscoli.
   ===================================================================== */
:root{
  color-scheme:light;
  /* --- tema chiaro: design system "Rugby moderno-retro" --- */
  --bg:#F4EEDC;            /* fondo schermo, carta crema */
  --surface:#FFFFFF;       /* card */
  --surface-2:#EFE9DA;     /* hover / fondo attenuato */
  --surface-3:#E2DDCE;     /* riempimenti neutri (barre, tracce, grafici vuoti) */
  --line:#DCD9D1;          /* bordo card */
  --line-2:#C9C4B6;        /* bordi marcati: tabelle, controlli, contorni spenti */
  --ink:#0B1B26;           /* inchiostro: titoli e testo forte */
  --ink-2:#3E4C56;         /* corpo del testo */
  --ink-3:#6B6656;         /* tenue: label, occhielli, date (scurito dal tono spec #8A8578: su crema era 3.17:1, sotto AA) */
  --ink-4:#5B6B76;         /* secondario: sottotitoli di riga, legende */
  --nav-item:#7C9AAE;      /* azzurro spento: icona inattiva sulla barra navy */
  --nav-active-bg:#00253F; --nav-active-fg:#FFFFFF;
  --accent:#8FC03F;        /* verde lime del logo: mai testo su chiaro */
  --accent-ui:#8FC03F;
  --accent-hover:#7FAE33;
  --accent-ink:#0B1B26;    /* inchiostro sopra il verde */
  --accent-soft:#E9F1DA;
  --accent-soft-ink:#3D6B12;
  --navy:#00253F;          /* navy: chip ad alto contrasto, si scambia col verde in scuro */
  --navy-light:#004070;    /* navy chiaro: accento testuale su chiaro (sigle, giorni) */
  --navy-ink:#FFFFFF;
  --navy-fixed:#00253F; --navy-fixed-ink:#FFFFFF; /* intestazione/barra: sempre navy, in entrambi i temi */
  --tag-line:#B9C6CE;   /* bordo delle etichette tonde (filtri, tipo partita) */
  --rule:#8FC03F;          /* filetto 3px sotto l'intestazione: il verde qui è un segno, non testo */
  --live-bg:#00253F; --live-fg:#FFFFFF; --live-muted:#7C9AAE; --live-score:#FFFFFF;
  --live-pill-bg:#8FC03F; --live-pill-ink:#0B1B26;
  --chart-1:#8FC03F; --chart-2:#004070;
  --good:#3D6B12; --good-soft:#E9F1DA;
  --warn:#8A6B1F; --warn-soft:#F0E4C4;
  --bad:#B23A2E;  --bad-soft:#F4DED9;
  --live:#B23A2E;
  --alert-navy:#FF8A73;    /* allerta: vive solo su fondo navy (es. "Fischio finale") */
  --shadow-card:0 4px 12px rgba(11,27,38,.10);
  --shadow-rilievo:0 10px 26px rgba(11,27,38,.18);
  --shadow:var(--shadow-card);
  --sk:#EAE6DB;                        /* segnaposto di caricamento */
  --sk-glow:rgba(255,255,255,.7);      /* riflesso che scorre sul segnaposto */
  --r-lg:20px; --r-md:14px; --r-sm:12px; --r-chip:4px;
  --r-pill:20px;   /* etichette: sempre a capsula */
  --font:"Archivo","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-display:"Big Shoulders Display",Rockwell,Georgia,serif;
  --font-data:"Chivo","Segoe UI",system-ui,sans-serif;
  --font-mono:"DM Mono","Segoe UI",monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --bg:#00131F; --surface:#00253F; --surface-2:#0A3252; --surface-3:#123A5C;
    --line:#123A5C; --line-2:#2C5C86;
    --ink:#F4EEDC;         /* la crema diventa l'inchiostro */
    --ink-2:#C7D4DC; --ink-3:#8FA6B8; --ink-4:#9FB3C2;
    --nav-item:#7C9AAE; --nav-active-bg:#8FC03F; --nav-active-fg:#0B1B26;
    --accent:#8FC03F; --accent-ui:#8FC03F; --accent-hover:#9FCC57; --accent-ink:#0B1B26;
    --accent-soft:rgba(143,192,63,.15); --accent-soft-ink:#A8CE6A;
    --navy:#8FC03F; --navy-light:#9FC2DA; --navy-ink:#0B1B26;
    --navy-fixed:#00253F; --navy-fixed-ink:#FFFFFF; --tag-line:#2C5C86;
    --rule:#8FC03F;
    --live-bg:#F4EEDC;     /* card "foglio di carta" sul blu notte */
    --live-fg:#00253F; --live-muted:#8A8578; --live-score:#00253F;
    --live-pill-bg:#8FC03F; --live-pill-ink:#0B1B26;
    --chart-1:#8FC03F; --chart-2:#7C9AAE;
    --good:#A8CE6A; --good-soft:rgba(143,192,63,.15);
    --warn:#E0B45E; --warn-soft:rgba(224,180,94,.15);
    --bad:#E27B6E;  --bad-soft:rgba(226,123,110,.15);
    --live:#E27B6E;
    --alert-navy:#FF8A73;
    --shadow-card:0 16px 36px rgba(0,20,40,.32);
    --shadow-rilievo:0 20px 44px rgba(0,20,40,.42);
    --shadow:var(--shadow-card);
    --sk:#0A3557; --sk-glow:rgba(180,210,235,.16);
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#F4EEDC; --surface:#FFFFFF; --surface-2:#EFE9DA; --surface-3:#E2DDCE;
  --line:#DCD9D1; --line-2:#C9C4B6;
  --ink:#0B1B26; --ink-2:#3E4C56; --ink-3:#6B6656; --ink-4:#5B6B76;
  --nav-item:#7C9AAE; --nav-active-bg:#00253F; --nav-active-fg:#FFFFFF;
  --accent:#8FC03F; --accent-ui:#8FC03F; --accent-hover:#7FAE33; --accent-ink:#0B1B26;
  --accent-soft:#E9F1DA; --accent-soft-ink:#3D6B12;
  --navy:#00253F; --navy-light:#004070; --navy-ink:#FFFFFF; --rule:#8FC03F;
  --navy-fixed:#00253F; --navy-fixed-ink:#FFFFFF; --tag-line:#B9C6CE;
  --live-bg:#00253F; --live-fg:#FFFFFF; --live-muted:#7C9AAE; --live-score:#FFFFFF;
  --live-pill-bg:#8FC03F; --live-pill-ink:#0B1B26;
  --chart-1:#8FC03F; --chart-2:#004070;
  --good:#3D6B12; --good-soft:#E9F1DA;
  --warn:#8A6B1F; --warn-soft:#F0E4C4;
  --bad:#B23A2E;  --bad-soft:#F4DED9;
  --live:#B23A2E; --alert-navy:#FF8A73;
  --shadow-card:0 4px 12px rgba(11,27,38,.10);
  --shadow-rilievo:0 10px 26px rgba(11,27,38,.18);
  --shadow:var(--shadow-card);
  --sk:#EAE6DB; --sk-glow:rgba(255,255,255,.7);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#00131F; --surface:#00253F; --surface-2:#0A3252; --surface-3:#123A5C;
  --line:#123A5C; --line-2:#2C5C86;
  --ink:#F4EEDC; --ink-2:#C7D4DC; --ink-3:#8FA6B8; --ink-4:#9FB3C2;
  --nav-item:#7C9AAE; --nav-active-bg:#8FC03F; --nav-active-fg:#0B1B26;
  --accent:#8FC03F; --accent-ui:#8FC03F; --accent-hover:#9FCC57; --accent-ink:#0B1B26;
  --accent-soft:rgba(143,192,63,.15); --accent-soft-ink:#A8CE6A;
  --navy:#8FC03F; --navy-light:#9FC2DA; --navy-ink:#0B1B26; --rule:#8FC03F;
  --navy-fixed:#00253F; --navy-fixed-ink:#FFFFFF; --tag-line:#2C5C86;
  --live-bg:#F4EEDC; --live-fg:#00253F; --live-muted:#8A8578; --live-score:#00253F;
  --live-pill-bg:#8FC03F; --live-pill-ink:#0B1B26;
  --chart-1:#8FC03F; --chart-2:#7C9AAE;
  --good:#A8CE6A; --good-soft:rgba(143,192,63,.15);
  --warn:#E0B45E; --warn-soft:rgba(224,180,94,.15);
  --bad:#E27B6E;  --bad-soft:rgba(226,123,110,.15);
  --live:#E27B6E; --alert-navy:#FF8A73;
  --shadow-card:0 16px 36px rgba(0,20,40,.32);
  --shadow-rilievo:0 20px 44px rgba(0,20,40,.42);
  --shadow:var(--shadow-card);
  --sk:#0A3557; --sk-glow:rgba(180,210,235,.16);
}

/* ================= base ================= */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
/* lo sfondo oltre i bordi della pagina (barra di stato del telefono, rimbalzo dello
   scorrimento) resta navy come intestazione e barra, invece di lasciare una fascia chiara */
html{background:var(--navy-fixed)}
html{scroll-behavior:smooth}
/* corpo del testo: 17px / 1,55 come da tabella del design system */
body{
  background:var(--bg);color:var(--ink-2);font-family:var(--font);
  font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;
  min-height:100vh;-webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font:inherit;color:inherit}
button,a,label{touch-action:manipulation}
h1,h2,h3,h4{margin:0;line-height:1.25;text-wrap:balance;color:var(--ink)}
p{margin:0}
a{color:var(--ink)}
/* transizioni: solo colore, nessuno spostamento (regola del tema) */
.btn,.iconbtn,.chip,.tile,.card.clickable,.nav button,.list-row.clickable,.altro-item,.role-pill,.permdot i,.switch i,.cat-card,.hero-card.clickable{
  transition:background-color .12s ease-out,color .12s ease-out,border-color .12s ease-out,filter .12s ease-out;
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* --- ruoli tipografici (Big Shoulders Display: titoli di schermata/sezione e TUTTI i numeri) --- */
.page-title,.sec-head h2,.club-name,.stat .k,.score .pts,.hero-card .big,.hero-card .scorebig{
  font-family:var(--font-display);font-weight:800;text-transform:uppercase;letter-spacing:.01em;
}
/* titolo di card (Archivo 900 maiuscolo, tracking negativo) */
/* titolo di comunicazione: Archivo bold 20px (il design system indicava 900, Alessio ha
   scelto 700 — meno pesante e piu leggibile su due righe) */
.com-card h3{font-family:var(--font);font-weight:700;text-transform:uppercase;letter-spacing:-.05em}
/* titoli funzionali: modali e stato vuoto restano in Archivo, non sono un momento di marca */
.modal h3,.empty-title{font-family:var(--font);font-weight:700}
/* date, orari, sigle, righe di dati: Chivo tabellare */
.num{font-family:var(--font-data)}
/* occhielli e sottotitoli in maiuscolo: DM Mono */
.eyebrow,.club-sub{font-family:var(--font-mono)}

/* ================= app shell ================= */
#app{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh;align-content:start}
.topbar{
  position:sticky;top:0;z-index:30;display:flex;flex-direction:column;
  padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);min-width:0;
  padding-top:calc(10px + env(safe-area-inset-top));
  padding-left:max(16px,env(safe-area-inset-left));
  padding-right:max(16px,env(safe-area-inset-right));
}
.topbar-main{display:flex;align-items:center;gap:12px;min-width:0}
.topbar-main .logo{width:38px;height:38px;flex:none}
.topbar-main .logo img,.topbar-main .logo svg{width:100%;height:100%;object-fit:contain;display:block}
.topbar-main .brand{flex:1 1 auto;min-width:0}
.back-chip{border-color:transparent;background:none}
.club-name{font-family:var(--font-display);font-weight:800;text-transform:uppercase;letter-spacing:.01em;font-size:30px;line-height:.9;color:var(--ink);overflow-wrap:anywhere}
.club-sub{font-size:13px;font-weight:500;letter-spacing:.12em;color:var(--ink-3);text-transform:uppercase;overflow-wrap:anywhere}
@media (max-width:420px){.club-name{font-size:26px}.topbar-main .logo{width:34px;height:34px}.topbar-main{gap:9px}}
/* il titolo di sezione resta a 40px come da design system anche su mobile:
   se il pulsante non ci sta, va a capo allineato a destra */
.topbar-main .spacer{flex:1}
.role-pill{
  display:flex;align-items:center;gap:7px;border:1px solid var(--line);
  background:var(--surface);border-radius:var(--r-pill);padding:6px 10px;font-size:13px;
  font-family:var(--font);font-weight:700;letter-spacing:.06em;color:var(--ink-2);cursor:pointer;max-width:46vw;
  text-transform:uppercase;min-width:0;flex:none;
}
.role-pill b{min-width:0}
.role-pill:hover{background:var(--surface-2)}
.role-pill b{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
/* pastiglia di livello: verde solo per L1 (Direzione), navy chiaro per gli altri (design system) */
.role-pill .lvl{flex:none;background:var(--navy-light);color:var(--navy-ink);border-radius:var(--r-pill);
  font-size:11px;font-weight:700;letter-spacing:.08em;padding:3px 8px}
.role-pill .lvl.l1{background:var(--accent);color:var(--accent-ink)}
/* su mobile l'intestazione diventa navy a due righe (design system): orologio+scorciatoia sopra,
   scudo/profilo/indietro con pastiglia di livello sotto, come nel mockup */
@media (max-width:959px){
  .topbar{background:var(--navy-fixed);border-bottom:0}
  .club-name{color:var(--navy-fixed-ink)}
  .club-sub{color:var(--live-muted)}
  #menuBtn,.back-chip{color:var(--navy-fixed-ink);border-color:transparent;background:rgba(255,255,255,.08)}
  #menuBtn:hover,.back-chip:hover{background:rgba(255,255,255,.16)}
  .role-pill{background:rgba(255,255,255,.08);border-color:transparent;color:var(--navy-fixed-ink)}
  .role-pill:hover{background:rgba(255,255,255,.16)}
  .role-pill b{color:var(--navy-fixed-ink)}
  /* il navy chiaro si confonde col fondo navy dell'intestazione mobile: qui la pastiglia
     non-L1 usa un contorno chiaro invece del fondo pieno, per restare leggibile */
  .role-pill .lvl:not(.l1){background:none;border:1.5px solid rgba(255,255,255,.55);color:var(--navy-fixed-ink)}
}

main{padding:20px 16px 100px;min-width:0;position:relative;z-index:1}
@media (min-width:960px){
  #app{grid-template-columns:212px minmax(0,1fr);column-gap:0}
  .topbar{grid-column:1/-1}
  main{padding:20px 22px 60px}
}
/* filigrana: scudo/firma dietro al contenuto, sempre uguale, solo su mobile (design system).
   Centrata con left/right/margin invece che con translateX: su Safari iOS il transform
   orizzontale su un elemento fisso si sposta durante lo scorrimento, così resta fermo.
   L'asse Y del transform resta libero per il parallasse (--wm-y, impostato da JS). */
#watermark{display:none}
@media (max-width:959px){
  #watermark{
    display:block;position:fixed;top:300px;left:0;right:0;margin-inline:auto;
    width:380px;max-width:97vw;
    transform:translateY(var(--wm-y,0px));opacity:.07;z-index:0;pointer-events:none;
    will-change:transform;
  }
}
@media (prefers-reduced-motion:reduce){#watermark{transform:none}}
/* Nessun filetto sotto il titolo: nel mockup non c'e, e il design system lo dichiara
   opzionale e "spento di default". */

/* ================= nav ================= */
.nav{
  position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;
  background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-left)) max(8px,env(safe-area-inset-bottom));
}
.nav button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;
  background:none;border:0;padding:8px 2px 6px;border-radius:var(--r-sm);cursor:pointer;
  color:var(--nav-item);font-family:var(--font);font-size:11px;font-weight:600;letter-spacing:.06em;
  position:relative;min-height:48px;text-transform:uppercase;
}
.nav button svg{width:22px;height:22px}
.nav button .ic-on{display:none}
.nav button.on{color:var(--ink)}
.nav button.on svg{color:var(--accent)}
.nav button.on .ic-off{display:none}
.nav button.on .ic-on{display:block}
@media (max-width:959px){
  .nav button.on::before{
    content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:22px;height:3px;background:var(--rule);
  }
  .nav button.mob-hide{display:none}
}
.nav button.hide-role{display:none!important}
/* barra sempre navy su mobile (design system): icona a contorno se inattiva,
   piena in verde se attiva — è un cambio di forma, non solo di colore */
@media (max-width:959px){
  .nav{background:var(--navy-fixed);border-top:0;min-height:76px;gap:0}
  .nav button{color:var(--nav-item);gap:5px}
  .nav button.on{color:var(--navy-fixed-ink)}
  .nav button.on svg{color:var(--live-pill-bg)}
  .nav button.on::before{display:none}
}
@media (min-width:960px){
  .nav{
    position:sticky;top:63px;bottom:auto;flex-direction:column;align-self:start;
    border:0;background:none;padding:20px 0 0 16px;gap:3px;
  }
  .nav button{
    flex:none;flex-direction:row;justify-content:flex-start;gap:11px;
    font-size:13px;padding:9px 11px;border-radius:var(--r-sm);text-transform:none;
    letter-spacing:0;font-weight:500;min-height:0;
  }
  .nav button:hover{background:var(--surface-2)}
  .nav button svg{width:18px;height:18px}
  .nav button.on{background:var(--nav-active-bg);color:var(--nav-active-fg);font-weight:700}
  .nav button.on svg{color:var(--nav-active-fg)}
  .nav button[data-view="altro"]{display:none}
}

/* pannello "Altro" */
.altro-item{
  display:flex;align-items:center;gap:13px;width:100%;padding:12px;
  border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);cursor:pointer;
  text-align:left;font-size:19px;font-weight:600;color:var(--ink);
}
.altro-item:hover{background:var(--surface-2)}
.altro-item svg{width:20px;height:20px;color:var(--accent-soft-ink);flex:none}
.altro-item .d{display:block;font-size:16px;font-weight:400;font-family:var(--font-data);color:var(--ink-3)}

/* ================= building blocks ================= */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:16px;box-shadow:var(--shadow-card);
}
.stack{display:flex;flex-direction:column;gap:10px}
/* respiro fra le sezioni: 56px come da "Misure del mockup" (sul desktop resta compatto) */
.stack-lg{display:flex;flex-direction:column;gap:56px}
@media (min-width:960px){.stack-lg{gap:36px}}
.row{display:flex;align-items:center;gap:10px}
.row .grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid-cards{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:680px){.grid-cards{grid-template-columns:1fr 1fr}}
@media (min-width:1060px){.grid-cards.three{grid-template-columns:1fr 1fr 1fr}}

.eyebrow{
  font-size:13px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);line-height:1.35;
}
/* se un occhiello precede il titolo (line-height .88) serve uno stacco */
.eyebrow+.page-title{display:block;margin-top:8px}
/* titolo di sezione: Big Shoulders 40px in navy chiaro (tabella caratteri) */
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.sec-head h2{font-size:40px;line-height:.9;color:var(--navy-light);flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:9px;white-space:nowrap}
.sec-head .eyebrow{flex:1}
.sec-head>.btn{margin-left:auto}
/* contatore di sezione: solo il pallino verde, senza numero (design system) */
.sec-dot{width:9px;height:9px;flex:none;border-radius:50%;background:var(--accent)}
/* titolo di schermata: 72px, il più grande della scala */
.page-title{font-size:80px;line-height:.88;color:var(--ink)}
.muted{color:var(--ink-3);font-size:16px;font-family:var(--font-data)}
.small{font-size:17px;color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}
@media (min-width:960px){
  .page-title{font-size:56px}
  .sec-head h2{font-size:30px}
}

/* etichetta di stato: Archivo 16px 700 maiuscolo */
.pill{
  display:inline-flex;align-items:center;gap:5px;border-radius:var(--r-pill);
  padding:3px 8px;font-family:var(--font-data);font-size:16px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;
  background:var(--surface-3);color:var(--ink-2);white-space:nowrap;
}
.pill.green{background:var(--accent);color:var(--accent-ink)}
.pill.tag{background:var(--accent);color:var(--accent-ink);border-radius:var(--r-pill);font-family:var(--font);font-size:11px;letter-spacing:.05em;padding:3px 7px}
.pill.blue{background:var(--navy);color:var(--navy-ink)}
.pill.round{padding:3px 9px;font-weight:500;background:none;border:1px solid var(--tag-line);color:var(--ink)}
.pill.round.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.live{background:var(--live-pill-bg);color:var(--live-pill-ink)}
.pill.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--live-pill-ink);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
/* pastiglie della card evento (costo/luogo): un luogo lungo non deve sforare dalla card —
   invece di andare a capo internamente (i .pill non lo fanno mai) si tronca con i puntini.
   ".pill" è inline-flex (per icona+testo) e text-overflow non ha effetto sui contenitori
   flex: la pastiglia senza icona (il luogo) passa a inline-block solo per poter troncare. */
.evento-tags .pill{min-width:0;max-width:100%}
.pill.trunc{display:inline-block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:top}
/* la pastiglia del costo ha un'icona: resta inline-flex (serve per allineare icona+testo),
   quindi qui a troncare con i puntini è solo il testo dentro, non l'intera pastiglia */
.pill-ico{flex:none;display:inline-flex}
.pill-txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* icone della pagina di dettaglio evento (Data/Orario/Luogo/Costo): più grandi di quelle
   usate nelle liste, qui sono da sole in un elenco e possono prendere più spazio */
.evento-info .icon-inline{width:24px;height:24px;margin-right:12px;vertical-align:-6px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:var(--r-md);padding:10px 16px;font-weight:700;font-size:16px;
  cursor:pointer;white-space:nowrap;min-height:44px;text-transform:uppercase;letter-spacing:.06em;
}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger:hover{background:var(--bad-soft)}
.btn.small{padding:8px 14px;font-size:16px;min-height:40px}
/* pulsante di sola aggiunta: quadrato, il + ben visibile */
.btn.solo-piu{padding:0;width:44px;min-width:44px;height:44px;min-height:44px;border-radius:var(--r-md)}
.btn.solo-piu svg{width:22px;height:22px}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn svg{width:17px;height:17px}
.iconbtn{
  flex:none;display:inline-flex;align-items:center;justify-content:center;
  width:44px;height:44px;border-radius:var(--r-sm);border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);cursor:pointer;
}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.iconbtn svg{width:18px;height:18px}
.iconbtn.danger:hover{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}

.list{display:flex;flex-direction:column}
.list>*+*{border-top:1px solid var(--line)}
.list-row{display:flex;align-items:center;gap:11px;padding:11px 2px;min-width:0}
.list-row .grow{flex:1;min-width:0}
.title{font-weight:600;font-size:19px;color:var(--ink);line-height:1.25}
/* riga di elenco del design system: sigla del giorno a sinistra (Chivo 700 navy chiaro),
   titolo 19/600, orario a destra in Chivo tabellare */
.list-row .giorno{
  width:56px;flex:none;font-family:var(--font-data);font-size:16px;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;color:var(--navy-light);
}
.list-row .orario{font-family:var(--font-data);font-size:17px;color:var(--ink-4);flex:none;white-space:nowrap}
/* card torneo dell'elenco "Prossimi tornei": padding proprio e pastiglie categoria
   ancorate a destra (era inline in 06-views.js) */
.torneo-card{padding:12px 14px}
.torneo-card .cats{flex:none;flex-wrap:wrap;gap:5px;justify-content:flex-end;max-width:40%}
/* blocco data della riga appuntamento: giorno grande, mese sotto */
.data-grande{display:flex;flex-direction:column;align-items:center;width:52px;flex:none}
.data-grande .giorno-n{font-family:var(--font-display);font-size:34px;line-height:.9;font-weight:800;color:var(--ink)}
.data-grande .muted{text-transform:uppercase;letter-spacing:.02em}
/* data/ora della card partita: mai spezzata su piu righe */
.quando{white-space:nowrap}
/* nella riga orario i pulsanti vanno a capo se giorno+titolo+ora riempiono la riga */
.riga-orario{flex-wrap:wrap}

/* elenco categorie: bottoni pieni, un colore per categoria, sigla enorme (mockup) */
.cat-card{
  display:flex;align-items:flex-end;min-height:88px;padding:4px 20px 0;
  border-radius:var(--r-md);box-shadow:var(--shadow-card);cursor:pointer;overflow:hidden;
}
/* la sigla sborda sotto il bordo e viene tagliata dall'overflow della card (come nel mockup) */
.cat-sigla{
  font-family:var(--font-display);font-size:70px;line-height:.9;font-weight:800;
  letter-spacing:.01em;text-transform:uppercase;color:#FFFFFF;margin-bottom:-7px;
}
.cat-card:hover{filter:brightness(.95)}
.clickable{cursor:pointer}
.list-row.clickable:hover,.card.clickable:hover,.tile:hover{background:var(--surface-2)}
/* feedback alla pressione: nessuno scatta ancora al tocco (solo :hover, che sul telefono
   non esiste). Regola del tema = "solo colore, nessuno spostamento" (riga 144), quindi qui
   niente transform: uno scurimento breve, come già fa .cat-card al passaggio del mouse. */
.btn:active,.iconbtn:active,.chip:active,.cat-card:active,
.list-row.clickable:active,.card.clickable:active,.tile:active,.hero-card.clickable:active{
  filter:brightness(.93);
}

.empty{
  border:1px dashed var(--line);border-radius:var(--r-md);padding:20px 16px;
  text-align:center;color:var(--ink-3);font-size:17px;
}

.avatar{
  flex:none;width:40px;height:40px;border-radius:var(--r-md);display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:17px;color:var(--accent-ink);
  background:var(--accent);letter-spacing:.02em;overflow:hidden;
}
.avatar.blue{background:var(--navy);color:var(--navy-ink)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}

/* contatori */
.stat{padding:12px 13px;border-radius:var(--r-lg);box-shadow:var(--shadow-card)}
.stat .k{font-size:38px;line-height:.9;color:var(--ink)}
.stat .k small{font-size:16px;font-family:var(--font);font-weight:700;color:var(--ink-3)}
.stat .eyebrow{font-size:9px;letter-spacing:.05em;font-weight:600;margin-bottom:5px;display:block}
/* quattro colonne anche su mobile: così nel mockup, i contatori sono sempre in riga */
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:420px){.stat{padding:10px 8px}.stat .k{font-size:24px}}

/* barre di avanzamento */
.meter{height:10px;border-radius:var(--r-chip);background:var(--surface-3);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--chart-1)}
.meter>i.over{background:var(--warn)}

/* punteggio */
.score{display:flex;align-items:baseline;gap:10px;font-variant-numeric:tabular-nums}
.score .pts{font-size:28px;color:var(--ink)}
.score .sep{color:var(--ink-3);font-size:20px}

/* filtri */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
/* filtri: pastiglie tonde come nel design system — contorno se spente, verde piene se attive */
.chip{
  flex:none;border:1px solid var(--tag-line);background:none;border-radius:var(--r-pill);
  padding:7px 15px;font-family:var(--font-data);font-size:16px;font-weight:500;color:var(--ink);cursor:pointer;
  text-transform:uppercase;letter-spacing:.02em;
}
.chip:hover{background:var(--surface-2)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}

/* riquadri del diario */
.tilegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:680px){.tilegrid{grid-template-columns:repeat(3,1fr)}}
.tile{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:13px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;
  text-align:center;gap:6px;min-height:86px;
}
.tile .t{font-weight:600;font-size:19px;line-height:1.25;color:var(--ink)}
.tile .n{margin-top:auto;font-size:16px;font-family:var(--font-data);color:var(--ink-3)}
.tile svg{width:18px;height:18px;color:var(--accent-soft-ink)}

/* ================= grafici ================= */
.chartbox{position:relative}
.chartbox svg{display:block;width:100%;height:auto}
/* le barre crescono dalla base invece di comparire già alla loro altezza (pagina personale,
   vista occasionalmente); stagger leggero via animation-delay inline (05-ui.js) */
.chartbox .bar{cursor:pointer;transform-box:fill-box;transform-origin:bottom;animation:barIn .4s ease-out backwards}
@keyframes barIn{from{transform:scaleY(0)}}
/* anello di "La mia area": lo stesso, il tratto colorato cresce dal vuoto al valore vero */
.donut-progress{animation:donutIn .6s ease-out}
@keyframes donutIn{from{stroke-dashoffset:var(--donut-c)}}
.tooltip{
  position:absolute;pointer-events:none;z-index:5;background:var(--navy);color:var(--navy-ink);
  border-radius:var(--r-chip);padding:6px 10px;font-size:16px;font-weight:700;white-space:nowrap;
  transform:translate(-50%,-110%);box-shadow:var(--shadow);display:none;
}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:16px;font-family:var(--font-data);color:var(--ink-2);font-weight:400}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* ================= form e finestre ================= */
.modal-veil{
  position:fixed;inset:0;z-index:100;background:rgba(0,20,40,.5);
  display:flex;align-items:flex-end;justify-content:center;animation:veilIn .12s ease-out;
}
@media (min-width:680px){.modal-veil{align-items:center;padding:24px}}
.modal{
  background:var(--surface);width:100%;max-width:560px;max-height:92dvh;overflow:auto;
  border:1px solid var(--line);border-radius:var(--r-lg) var(--r-lg) 0 0;
  padding:20px 18px calc(18px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);
  animation:sheetUp .18s ease-out;
}
@media (min-width:680px){.modal{border-radius:var(--r-lg);padding:22px;animation-name:popIn}}
/* chiusura: prima l'apertura era animata ma la chiusura spariva di scatto (innerHTML svuotato
   subito) — qui l'uscita è il percorso inverso dell'entrata, più rapida (l'utente sta andando
   via, non deve aspettare) */
.modal-veil.closing{animation:veilOut .12s ease-in forwards}
.modal.closing{animation:sheetDown .14s ease-in forwards}
@media (min-width:680px){.modal.closing{animation-name:popOut}}
@keyframes veilIn{from{opacity:0}}
@keyframes veilOut{to{opacity:0}}
@keyframes sheetUp{from{transform:translateY(26px);opacity:.5}}
@keyframes sheetDown{to{transform:translateY(26px);opacity:.5}}
@keyframes popOut{to{opacity:0}}
@keyframes popIn{from{opacity:0}}
@keyframes viewIn{from{opacity:0}}
main.anim>*{animation:viewIn .14s ease-out}
/* elemento appena creato (vedi _nuovoId in 06-views.js): entra invece di comparire già al
   suo posto in cima alla lista. Classe generica, riusabile ovunque serva lo stesso effetto. */
.entra{animation:entra .22s ease-out}
@keyframes entra{from{opacity:0;transform:translateY(6px)}}
.modal h3{font-size:17px;line-height:1.25}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:500;font-family:var(--font-mono);color:var(--ink-3);letter-spacing:.12em;text-transform:uppercase}
.field input,.field select,.field textarea{
  border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);
  padding:11px 12px;font-size:16px;width:100%;min-height:44px;color:var(--ink-2);
}
.field textarea{min-height:110px;resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:0}
.field .err{color:var(--bad);font-size:16px;font-weight:700;display:flex;align-items:center;gap:4px}
.checkrow{display:flex;align-items:center;gap:9px;padding:9px 2px;font-size:17px;cursor:pointer;min-height:44px}
.checkrow input{width:20px;height:20px;accent-color:var(--accent)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:4px;flex-wrap:wrap}
.modal-actions .btn{min-width:96px}

/* interruttore */
.switch{position:relative;width:46px;height:26px;flex:none;cursor:pointer}
.switch input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.switch i{position:absolute;inset:0;border-radius:13px;background:var(--surface-3);border:1px solid var(--line-2)}
.switch i::after{
  content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
  background:var(--surface);border:1px solid var(--line-2);transition:transform .12s ease-out;
}
.switch input:checked+i{background:var(--accent);border-color:var(--accent)}
.switch input:checked+i::after{transform:translateX(20px)}
.switch input:disabled+i{opacity:.45}

/* matrice dei permessi */
.permwrap{overflow-x:auto;border:1px solid var(--line-2);border-radius:var(--r-md)}
.permtable{border-collapse:collapse;width:100%;min-width:520px;font-size:17px}
.permtable th,.permtable td{padding:10px 8px;text-align:center;border:1px solid var(--line-2)}
.permtable th:first-child,.permtable td:first-child{text-align:left;font-weight:700;padding-left:12px;color:var(--ink)}
.permtable tr>*:first-child{border-left:0}
.permtable tr>*:last-child{border-right:0}
.permtable thead th{
  font-size:13px;font-family:var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
  background:var(--surface-2);border-top:0;font-weight:700;
}
.permtable tbody tr:last-child>*{border-bottom:0}

/* pallino permesso: vuoto = no, pieno con spunta = sì */
/* il pallino resta piccolo (tabella densa), ma l'area toccabile invisibile arriva a 44px:
   l'input si allarga oltre il bordo del pallino senza spostare le colonne della tabella */
.permdot{position:relative;width:28px;height:28px;display:inline-flex;vertical-align:middle;cursor:pointer}
.permdot input{position:absolute;inset:-8px;opacity:0;margin:0;cursor:pointer}
.permdot i{
  width:28px;height:28px;border-radius:50%;border:2px solid var(--line-2);
  background:var(--surface);display:flex;align-items:center;justify-content:center;
}
.permdot i::after{
  content:"";width:11px;height:6px;margin-top:-3px;
  border-left:2.5px solid var(--accent-ink);border-bottom:2.5px solid var(--accent-ink);
  transform:rotate(-45deg);opacity:0;transition:opacity .12s ease-out;
}
.permdot input:checked+i,.permdot i.on{background:var(--accent);border-color:var(--accent)}
.permdot input:checked+i::after,.permdot i.on::after{opacity:1}
.permdot input:disabled+i{opacity:.45}
.permdot input:disabled{cursor:not-allowed}

/* avviso temporaneo */
#toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:200;
  background:var(--navy);color:var(--navy-ink);border-radius:var(--r-md);padding:10px 18px;
  font-size:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  box-shadow:var(--shadow);opacity:0;transition:opacity .2s cubic-bezier(.23,1,.32,1);pointer-events:none;max-width:90vw;
}
:root[data-theme="dark"] #toast{background:var(--accent);color:var(--accent-ink)}
#toast.show{opacity:1}
@media (min-width:960px){#toast{bottom:32px}}

/* testi lunghi: accorciati con "Leggi tutto" */
/* "Leggi tutto/Riduci": -webkit-line-clamp da solo va e viene di scatto (non è una proprietà
   animabile) — qui resta lui a tagliare la riga con i puntini veri, e max-height in più
   serve solo a rendere il cambio di altezza una transizione invece di uno scatto. */
.longtext{
  white-space:pre-wrap;font-size:17px;line-height:1.55;color:var(--ink-2);text-wrap:pretty;
  max-height:2000px;overflow:hidden;transition:max-height .25s ease-out;
}
.longtext.clamp{
  max-height:106px;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;
}
/* comunicazioni in Home: 2 righe invece di 4 */
.longtext.clamp.due-righe{max-height:53px;-webkit-line-clamp:2}
.readmore{
  align-self:flex-start;border:0;background:none;cursor:pointer;padding:4px 0;
  font-size:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--accent-soft-ink);text-decoration:underline;text-underline-offset:3px;
}
.readmore:hover{color:var(--ink)}
.readmore[hidden]{display:none}

/* ================= stili di menu alternativi ================= */
/* 2) a tendina: si apre dall'icona nell'intestazione */
#menuBtn{display:none}
[data-menu="tendina"] #menuBtn{display:inline-flex}
[data-menu="tendina"] #app{grid-template-columns:minmax(0,1fr)}
[data-menu="tendina"] .nav{
  position:fixed;top:var(--topbar-h,62px);left:0;right:0;bottom:auto;z-index:45;
  flex-direction:column;gap:2px;padding:8px;border-top:0;border-bottom:1px solid var(--line);
  background:var(--surface);box-shadow:var(--shadow);display:none;
  max-height:calc(100dvh - var(--topbar-h,62px));overflow-y:auto;
}
[data-menu="tendina"] .nav.open{display:flex;animation:tendina .14s ease-out}
[data-menu="tendina"] .nav.closing{display:flex;animation:tendinaOut .12s ease-in forwards}
@keyframes tendina{from{opacity:0;transform:translateY(-6px)}}
@keyframes tendinaOut{to{opacity:0;transform:translateY(-6px)}}
[data-menu="tendina"] .nav button{
  flex:none;flex-direction:row;justify-content:flex-start;gap:12px;min-height:48px;
  font-size:15px;font-weight:500;padding:12px;text-transform:none;letter-spacing:0;
}
[data-menu="tendina"] .nav button svg{width:19px;height:19px}
[data-menu="tendina"] .nav button.on{background:var(--nav-active-bg);color:var(--nav-active-fg);font-weight:700}
[data-menu="tendina"] .nav button.on svg{color:var(--nav-active-fg)}
[data-menu="tendina"] .nav button.on::before{display:none}
[data-menu="tendina"] main{padding-bottom:40px}

/* 3) barra in alto: sezioni in fila sotto l'intestazione */
[data-menu="alto"] #app{grid-template-columns:minmax(0,1fr)}
[data-menu="alto"] .nav{
  position:sticky;top:var(--topbar-h,62px);left:auto;right:auto;bottom:auto;z-index:29;
  flex-direction:row;justify-content:safe center;gap:2px;padding:6px 10px;
  overflow-x:auto;scrollbar-width:none;
  border-top:0;border-bottom:1px solid var(--line);background:var(--surface);
}
[data-menu="alto"] .nav::-webkit-scrollbar{display:none}
[data-menu="alto"] .nav button{
  /* si allargano insieme fino a riempire la barra, testo centrato */
  flex:1 1 auto;min-width:max-content;justify-content:center;
  flex-direction:row;gap:7px;min-height:40px;padding:8px 10px;
  font-size:11px;letter-spacing:.06em;
}
[data-menu="alto"] .nav button svg{width:17px;height:17px}
[data-menu="alto"] .nav button.on{background:var(--nav-active-bg);color:var(--nav-active-fg)}
[data-menu="alto"] .nav button.on svg{color:var(--nav-active-fg)}
[data-menu="alto"] .nav button.on::before{display:none}
[data-menu="alto"] main{padding-bottom:40px}

/* comunicazioni */
.com-card{display:flex;flex-direction:column;gap:6px}
.card.com-card{border-left:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px}
.com-card.pinned,.card.com-card.pinned{border-left:4px solid var(--accent)}
/* riga di testata delle comunicazioni: pastiglia, data e pulsanti possono andare a capo
   senza spezzare la data su due righe */
.com-card .row{flex-wrap:wrap}
.com-card .row .num{white-space:nowrap}
/* i pulsanti d'azione restano sempre insieme e a destra: se non c'e spazio vanno a capo in blocco */
.row-actions{display:flex;align-items:center;gap:8px;flex:none;margin-left:auto}
.com-card h3{font-size:20px;line-height:1.25}
.com-card .body{white-space:pre-wrap;font-size:17px;line-height:1.55;color:var(--ink-2);text-wrap:pretty}

/* card del punteggio: navy con rilievo, tinta piatta, niente gradienti */
.hero-card{
  background:var(--live-bg);border:0;color:var(--live-fg);
  border-radius:var(--r-lg);padding:18px 20px;position:relative;overflow:hidden;
  box-shadow:var(--shadow-rilievo);
}
.hero-card .eyebrow{color:var(--live-muted)}
.hero-card .big{font-size:25px;line-height:.95;margin-top:8px;color:var(--live-fg)}
/* banner del ruolo in "La mia area" (mockup): tinta unita, solo il testo centrato e la
   freccetta — un <select> vero copre tutta la card (invisibile, come ".permdot input")
   così resta un controllo nativo, accessibile e cliccabile ovunque, senza il suo aspetto. */
.ruolo-switch{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}
.ruolo-switch .big{margin-top:0}
.ruolo-switch .chev-down{width:20px;height:20px;flex:none;color:var(--live-muted);transform:rotate(90deg)}
.ruolo-switch select{position:absolute;inset:0;opacity:0;cursor:pointer;border:0}
.hero-card .sub{font-family:var(--font-data);font-size:17px;color:var(--live-muted);margin-top:6px}
.hero-card .scorebig{
  font-size:80px;line-height:.8;margin-top:10px;letter-spacing:-.06em;color:var(--live-score);font-variant-numeric:tabular-nums;
}
.hero-card .scorebig .vs{margin:0 8px}
/* tabellone della partita: due colonne (noi / loro) sotto il punteggio unico */
.hero-card .scorebig{display:block;text-align:center}
.tabellone{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.tabellone .squadra{
  font-family:var(--font-display);font-weight:700;font-size:25px;line-height:.95;
  text-transform:uppercase;color:var(--live-fg);margin-bottom:8px;
}
.tabellone>div:last-child .squadra{color:var(--live-muted)}
/* la squadra avversaria ha lo stesso bottone "+1" ma di un altro colore (il blu già
   validato per i grafici, --chart-2, invece del verde) — le due colonne si riconoscono
   a colpo d'occhio, mani fredde comprese, senza dover leggere il nome della squadra */
.tabellone>div:last-child .btn.score-btn.primary{background:var(--chart-2);border-color:var(--chart-2);color:var(--live-fg)}
/* comandi da bordo campo: 52x48 come da design system */
.hero-card .btn.score-btn{
  min-width:52px;height:48px;min-height:48px;padding:0;
  font-family:var(--font-display);font-size:28px;font-weight:800;letter-spacing:0;
}
.hero-pill{
  display:inline-flex;align-items:center;gap:6px;background:var(--live-pill-bg);color:var(--live-pill-ink);
  border-radius:var(--r-pill);padding:4px 10px;font-family:var(--font-data);font-size:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
}
.hero-pill.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--live-pill-ink);animation:blink 1.4s infinite}
/* elementi dentro il tabellone navy ("comandi da bordo campo" dello spec):
   testo secondario e bottoni restano leggibili sul fondo scuro */
.hero-card .muted,.hero-card .small{color:var(--live-muted)}
.hero-card .btn{border-color:rgba(255,255,255,.3);background:transparent;color:var(--live-fg)}
.hero-card .btn:hover{background:rgba(255,255,255,.1)}
.hero-card .btn.primary{background:var(--live-pill-bg);border-color:var(--live-pill-bg);color:var(--live-pill-ink)}
.hero-card .btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.hero-card .btn.danger{color:var(--alert-navy);border-color:var(--alert-navy)}
.hero-card .btn.danger:hover{background:rgba(255,138,115,.15)}
.hero-card hr.sep{border-top-color:rgba(255,255,255,.14)}

/* locandine eventi */
.poster{border-radius:var(--r-md);overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.poster img{display:block;width:100%;max-height:520px;object-fit:contain}
.poster-thumb{
  flex:none;width:56px;height:56px;border-radius:var(--r-md);overflow:hidden;
  border:1px solid var(--line);background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;color:var(--ink-3);
}
.poster-thumb img{width:100%;height:100%;object-fit:cover}

.icon-inline{width:15px;height:15px;vertical-align:-3px;margin-right:4px;color:var(--ink-3)}
hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0}

/* =====================================================================
   Segnaposto di caricamento (skeleton)
   Forme grigie che ricalcano la schermata mentre i dati arrivano, così
   l'impaginazione non salta quando compaiono davvero.
   ===================================================================== */
.sk{
  display:block;position:relative;overflow:hidden;
  background:var(--sk);border-radius:var(--r-sm);
}
.sk::after{
  content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent 18%,var(--sk-glow) 50%,transparent 82%);
  animation:skShine 1.4s ease-in-out infinite;
}
@keyframes skShine{to{transform:translateX(100%)}}
/* a movimento ridotto resta una forma ferma, senza riflesso */
@media (prefers-reduced-motion:reduce){.sk::after{display:none}}

.sk-line{height:12px}
.sk-line.tall{height:15px}
.sk-title{height:22px;border-radius:var(--r-sm)}
.sk-eyebrow{height:9px;width:120px;border-radius:var(--r-chip)}
.sk-num{height:30px;width:54px}
.sk-chip{height:22px;width:84px;border-radius:var(--r-pill)}
.sk-btn{height:32px;width:110px;border-radius:var(--r-md)}
.sk-icon{height:34px;width:34px;border-radius:var(--r-sm)}
.sk-avatar{height:44px;width:44px;border-radius:50%;flex:none}
.sk-thumb{height:56px;width:56px;border-radius:var(--r-md);flex:none}
.sk-block{height:120px;border-radius:var(--r-md)}
.sk-ring{height:112px;width:112px;border-radius:50%;flex:none}
.sk-score{height:46px;width:150px;margin-top:8px}
.sk-poster{height:230px;border-radius:var(--r-md)}

/* una riga di elenco: pallino/etichetta a sinistra, due righe di testo */
.sk-row{display:flex;align-items:center;gap:12px;padding:14px 16px}
.sk-row .grow{display:flex;flex-direction:column;gap:7px;flex:1;min-width:0}
.sk-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:16px;display:flex;flex-direction:column;gap:10px;
}
.sk-hero{background:var(--live-bg);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px}
/* sulla card del punteggio i segnaposto seguono il fondo: chiari sul navy,
   scuri quando al buio la card diventa un foglio di carta chiaro */
.sk-hero .sk{--sk:rgba(255,255,255,.16);--sk-glow:rgba(255,255,255,.12)}
:root[data-theme="dark"] .sk-hero .sk{--sk:rgba(0,64,112,.12);--sk-glow:rgba(0,64,112,.07)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme]) .sk-hero .sk{--sk:rgba(0,64,112,.12);--sk-glow:rgba(0,64,112,.07)}
}

/* immagini: il riquadro grigio resta finché la foto non è arrivata */
.imgsk{position:relative;background:var(--sk);overflow:hidden}
.imgsk::after{
  content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent 18%,var(--sk-glow) 50%,transparent 82%);
  animation:skShine 1.4s ease-in-out infinite;
}
.imgsk.ok{background:none}
.imgsk.ok::after{display:none}
.imgsk img{opacity:0;transition:opacity .18s ease-out}
.imgsk.ok img{opacity:1}
@media (prefers-reduced-motion:reduce){.imgsk::after{display:none}.imgsk img{transition:none}}

/* mentre si carica non si può toccare nulla di ciò che non c'è ancora */
main[aria-busy="true"]{pointer-events:none}

/* =====================================================================
   HOME GENITORI (L5) — hero, card dei due figli, scheda a comparsa
   Colori dei figli fissi (non seguono il tema chiaro/scuro, come il navy
   dell'intestazione): sono l'identità del figlio, non un accento di UI.
   ===================================================================== */
.figlio-hero{
  position:relative;overflow:hidden;background:var(--navy-fixed);color:var(--navy-fixed-ink);
  margin:-20px -16px 0;padding:16px 20px 46px;border-radius:0 0 40px 40px;
}
@media (min-width:960px){.figlio-hero{margin:-20px -22px 0}}
.figlio-hero-glow{
  position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(120% 110% at 85% 0%, rgba(143,192,63,.24), rgba(143,192,63,0) 62%);
}
.figlio-hero-eyebrow{
  position:relative;font-family:var(--font-mono);font-size:12px;
  letter-spacing:.26em;text-transform:uppercase;color:var(--chart-1);
}
.figlio-hero-titolo{
  position:relative;margin-top:8px;font-family:var(--font-display);font-size:52px;
  line-height:.87;font-weight:800;text-transform:uppercase;color:#FFFFFF;
}
.figlio-cards{position:relative;margin-top:-30px;display:grid;grid-template-columns:1fr 1fr;gap:11px}
.figlio-card{
  border-radius:24px;padding:14px 15px 15px;display:flex;flex-direction:column;gap:22px;
  box-shadow:0 14px 28px rgba(11,27,38,.24);cursor:pointer;transition:transform .16s ease;color:#FFFFFF;
}
.figlio-card:active{transform:scale(.97)}
.figlio-card-freccia{align-self:flex-end;width:16px;height:16px;color:#FFFFFF}
.figlio-card-freccia svg{width:100%;height:100%}
.figlio-card-nome{
  font-family:var(--font-display);font-size:36px;line-height:.86;font-weight:800;text-transform:uppercase;
}

/* scheda a comparsa: scende dall'alto, esce verso il basso, resta ferma finché non la si
   apre/chiude (vive fuori da #main, vedi #figlioRoot in 03-body.html). */
.figlio-drawer{
  position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;overflow-y:auto;
  background:var(--bg);transform:translateY(-100%);
  transition:transform .42s cubic-bezier(.32,.72,0,1);touch-action:none;
}
.figlio-drawer.aperta{transform:translateY(0)}
.figlio-drawer.uscita{transform:translateY(100%)}
.figlio-maniglia{
  position:sticky;top:0;z-index:2;align-self:center;margin-top:8px;width:52px;height:14px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.figlio-maniglia span{width:42px;height:4px;border-radius:999px;background:rgba(255,255,255,.5)}
.figlio-drawer-inner{margin-top:-14px;flex:1;display:flex;flex-direction:column;min-height:0}
.figlio-testata{
  position:relative;overflow:hidden;background:var(--navy-fixed);color:#FFFFFF;
  padding:14px 18px 54px;border-radius:0 0 90px 90px;text-align:center;
}
.figlio-testata-glow{
  position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(130% 100% at 50% -20%, rgba(143,192,63,.26), rgba(143,192,63,0) 64%);
}
.figlio-testata-eyebrow{
  position:relative;font-family:var(--font-mono);font-size:12px;letter-spacing:.26em;
  text-transform:uppercase;color:var(--chart-1);
}
.figlio-testata-titolo{
  position:relative;margin-top:8px;font-family:var(--font-display);font-size:56px;line-height:.86;
  font-weight:800;text-transform:uppercase;color:#FFFFFF;
}
.figlio-selettore{position:relative;margin-top:-42px;display:flex;align-items:center;justify-content:center;gap:16px}
.figlio-freccia{display:flex;width:32px;height:32px;align-items:center;justify-content:center;color:#B3AB96;cursor:pointer}
.figlio-freccia svg{width:18px;height:18px}
.figlio-avatar{
  width:104px;height:104px;flex:none;border-radius:50%;border:6px solid var(--bg);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  box-shadow:0 14px 30px rgba(11,27,38,.26);
}
.figlio-avatar-nome{
  font-family:var(--font-display);font-size:34px;line-height:.86;font-weight:800;
  text-transform:uppercase;color:#FFFFFF;
}
.entra-sx{animation:figlioEntraSx .34s cubic-bezier(.23,1,.32,1) both}
.entra-dx{animation:figlioEntraDx .34s cubic-bezier(.23,1,.32,1) both}
@keyframes figlioEntraDx{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
@keyframes figlioEntraSx{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:translateX(0)}}
.figlio-puntini{margin-top:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.figlio-punto{width:6px;height:5px;border-radius:999px;background:var(--surface-3)}
.figlio-punto.on{width:20px}
.figlio-corpo{flex:1;padding:18px 16px 24px;display:flex;flex-direction:column;gap:14px}
.figlio-live{
  background:#0B1B26;border-radius:34px;padding:16px 20px 18px;display:flex;flex-direction:column;gap:12px;
  box-shadow:0 16px 34px rgba(11,27,38,.28);color:#FFFFFF;
}
.figlio-live-head{
  display:flex;align-items:center;gap:9px;font-family:var(--font-mono);font-size:12px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--chart-1);
}
.figlio-live-dot{width:8px;height:8px;border-radius:50%;background:var(--chart-1);animation:blink 1.4s infinite}
.figlio-live-vs{display:flex;align-items:center;justify-content:space-between;gap:12px}
.figlio-live-sq{font-family:var(--font-display);font-size:24px;line-height:.95;font-weight:800;text-transform:uppercase}
.figlio-live-sq.avv{color:#B9C9D4;font-weight:700}
.figlio-live-score{
  display:flex;align-items:center;gap:8px;background:var(--chart-1);border-radius:999px;padding:8px 16px;
  font-family:var(--font-display);font-weight:800;line-height:.8;font-size:40px;color:#00253F;
}
.figlio-live-score span{font-size:22px;color:#1C4A16}
.figlio-prox{
  background:var(--surface);border-radius:34px;padding:17px 20px 16px;display:flex;flex-direction:column;gap:14px;
  box-shadow:0 8px 18px rgba(11,27,38,.10);
}
.figlio-prox-titolo{font-family:var(--font-display);font-size:30px;line-height:.9;font-weight:800;text-transform:uppercase;color:var(--ink)}
.figlio-settimana{border-top:1.5px solid var(--line);padding-top:13px;display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.figlio-giorno{
  border-radius:999px;background:var(--surface-3);padding:6px 0;text-align:center;
  font-family:var(--font-mono);font-size:11px;color:var(--ink-3);
}
.figlio-giorno.oggi{background:var(--navy-fixed);color:var(--navy-fixed-ink)}
.figlio-giorno.match{background:var(--chart-1);color:#1C4A16}
.figlio-suggerimento{
  margin-top:auto;padding-top:20px;text-align:center;font-family:var(--font-mono);
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
}

const LS_KEY = "rps_gestione_v1";

/* ---------- utilità ---------- */
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const MESI = ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
const GIORNI = ["Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato","Domenica"];

function fmtDate(iso, withYear = true) {
  if (!iso) return "—";
  const d = new Date(iso + (iso.length === 10 ? "T12:00" : ""));
  if (isNaN(d)) return iso;
  return d.getDate() + " " + MESI[d.getMonth()] + (withYear ? " " + d.getFullYear() : "");
}
function fmtDateLong(iso) {
  if (!iso) return "—";
  const d = new Date(iso + "T12:00");
  if (isNaN(d)) return iso;
  const gg = ["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];
  return gg[d.getDay()] + " " + d.getDate() + " " + MESI[d.getMonth()] + " " + d.getFullYear();
}
/* data in formato ISO ma nel fuso orario locale (toISOString userebbe UTC e dopo mezzanotte sbaglierebbe giorno) */
const isoLocal = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");

function seedPresenze(startISO, weeks, perWeek, missRate, salt) {
  // genera un registro presenze deterministico per la demo
  const out = [];
  const start = new Date(startISO + "T12:00");
  let k = salt;
  const rnd = () => { k = (k * 9301 + 49297) % 233280; return k / 233280; };
  for (let w = 0; w < weeks; w++) {
    for (let s = 0; s < perWeek; s++) {
      const d = new Date(start);
      d.setDate(d.getDate() + w * 7 + s * 2);
      if (d > new Date()) break;
      if (d.getMonth() === 11 && d.getDate() > 20) continue; // pausa natalizia
      out.push({ id: uid(), data: isoLocal(d), presente: rnd() > missRate });
    }
  }
  return out;
}

let S = load();
function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (d && d.version === 1) return migrate(d);
    }
  } catch (e) { /* dati corrotti: si riparte dalla demo */ }
  return defaultData();
}
function migrate(d) {
  // aggiornamenti leggeri per dati salvati con versioni precedenti dell'app
  const r5 = d.ruoli && d.ruoli.find(r => r.livello === 5);
  if (r5 && r5.nome === "Aiuto allenatore") r5.nome = "Genitore";
  if (!d.permessi.contatti) d.permessi.contatti = { r2: true, r3: false, r4: false, r5: false };
  if (!Array.isArray(d.contatti)) d.contatti = defaultData().contatti;
  if (!d.permessi.eventi) d.permessi.eventi = { r2: true, r3: true, r4: false, r5: false };
  if (!Array.isArray(d.eventi)) d.eventi = [];
  for (const a of d.allenatori) { a.telefono = a.telefono ?? ""; a.email = a.email ?? ""; a.foto = a.foto ?? ""; }
  for (const p of d.partite) { p.info = Array.isArray(p.info) ? p.info : []; p.collegaTorneo = p.collegaTorneo ?? ""; }
  for (const c of d.categorie) { c.comunicazioni = Array.isArray(c.comunicazioni) ? c.comunicazioni : []; }
  d.settings.profiloAllenatore = d.settings.profiloAllenatore ?? "";
  d.settings.menu = d.settings.menu ?? "classico";
  d.settings.provaCaricamento = Number(d.settings.provaCaricamento) || 0;
  return d;
}
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); }

}

function addMin(hhmm, min) {
  const [h, m] = hhmm.split(":").map(Number);
  const tot = h * 60 + m + min;
  return String(Math.floor(tot / 60) % 24).padStart(2, "0") + ":" + String(tot % 60).padStart(2, "0");
}
/* Prossimi impegni delle categorie di un allenatore: allenamenti (14 gg), tornei e partite */
function impegniAllenatore(a) {
  const oggi = todayISO();
  const out = [];
  const cats = a.categorie.map(getCat).filter(Boolean);
  for (const c of cats) {
    for (const t of c.tornei) if (t.data >= oggi)
      out.push({ tipo: "Torneo", data: t.data, ora: "09:00", fine: "17:00", titolo: t.nome + " — " + c.nome, luogo: t.luogo || "" });
    for (const o of c.orari) {
      for (let i = 0; i < 14; i++) {
        const d = new Date(); d.setDate(d.getDate() + i);
        if ((d.getDay() + 6) % 7 !== o.giorno) continue;   // 0 = lunedì
        const iso = isoLocal(d);
        if (iso < oggi) continue;
        out.push({ tipo: "Allenamento", data: iso, ora: o.dalle, fine: o.alle, titolo: "Allenamento " + c.nome, luogo: o.luogo || "" });
      }
    }
  }
  for (const p of S.partite)
    if (a.categorie.includes(p.categoria) && p.stato !== "terminata" && p.data >= oggi)
      out.push({ tipo: "Partita", data: p.data, ora: p.ora || "10:00", fine: addMin(p.ora || "10:00", 120), titolo: nomeCat(p.categoria) + " — " + p.avversario, luogo: p.luogo || "" });
  return out.sort((x, y) => (x.data + x.ora) < (y.data + y.ora) ? -1 : 1);
}
/* Link "aggiungi a Google Calendar" per un impegno */
function gcalLink(ev) {
  const d = ev.data.replace(/-/g, "");
  const ini = d + "T" + ev.ora.replace(":", "") + "00";
  const fin = d + "T" + (ev.fine || addMin(ev.ora, 90)).replace(":", "") + "00";
  return "https://calendar.google.com/calendar/render?action=TEMPLATE" +
    "&text=" + encodeURIComponent(ev.titolo) +
    "&dates=" + ini + "/" + fin +
    "&location=" + encodeURIComponent(ev.luogo) +
    "&details=" + encodeURIComponent(S.settings.club);
}
/* File calendario .ics: allenamenti ricorrenti (fino a fine stagione), tornei e partite */
function icsAllenatore(a) {
  const esc = s => String(s || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
  const stamp = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
  const BYDAY = ["MO", "TU", "WE", "TH", "FR", "SA", "SU"];
  const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Rugby Parco Sempione//IT", "CALSCALE:GREGORIAN"];
  let n = 0;
  const evento = (dtstart, dtend, titolo, luogo, rrule) => {
    L.push("BEGIN:VEVENT", "UID:rps-" + a.id + "-" + (n++) + "@rugbyparcosempione",
      "DTSTAMP:" + stamp, "DTSTART:" + dtstart, "DTEND:" + dtend,
      "SUMMARY:" + esc(titolo));
    if (luogo) L.push("LOCATION:" + esc(luogo));
    if (rrule) L.push(rrule);
    L.push("END:VEVENT");
  };
  const oggi = todayISO();
  const cats = a.categorie.map(getCat).filter(Boolean);
  for (const c of cats) {
    for (const o of c.orari) {
      // prima occorrenza futura di quel giorno della settimana
      const d = new Date();
      while ((d.getDay() + 6) % 7 !== o.giorno) d.setDate(d.getDate() + 1);
      const iso = isoLocal(d).replace(/-/g, "");
      evento(iso + "T" + o.dalle.replace(":", "") + "00", iso + "T" + o.alle.replace(":", "") + "00",
        "Allenamento " + c.nome, o.luogo,
        "RRULE:FREQ=WEEKLY;BYDAY=" + BYDAY[o.giorno] + ";UNTIL=20270630T220000Z");
    }
    for (const t of c.tornei) if (t.data >= oggi) {
      const d = t.data.replace(/-/g, "");
      evento(d + "T090000", d + "T170000", "Torneo: " + t.nome + " (" + c.nome + ")", t.luogo);
    }
  }
  for (const p of S.partite)
    if (a.categorie.includes(p.categoria) && p.stato !== "terminata" && p.data >= oggi) {
      const d = p.data.replace(/-/g, "");
      const ora = (p.ora || "10:00");
      evento(d + "T" + ora.replace(":", "") + "00", d + "T" + addMin(ora, 120).replace(":", "") + "00",
        nomeCat(p.categoria) + " — " + p.avversario, p.luogo);
    }
  L.push("END:VCALENDAR");
  return L.join("\r\n");
}

/* Tornei futuri di tutte le categorie, raggruppati per nome+data */
function torneiInArrivo() {
  const oggi = todayISO();
  const map = new Map();
  for (const c of S.categorie) for (const t of c.tornei) {
    if (t.data < oggi) continue;
    const k = t.nome + "|" + t.data;
    if (!map.has(k)) map.set(k, { nome: t.nome, data: t.data, luogo: t.luogo, note: t.note, cats: [] });
    map.get(k).cats.push(c);
  }
  return [...map.values()].sort((a, b) => a.data < b.data ? -1 : 1);
}

  const fatte = a.presenze.filter(p => p.presente).length;
  const registrate = a.presenze.length;
  const perc = a.contratto > 0 ? Math.round(fatte / a.contratto * 100) : 0;
  return { fatte, registrate, assenze: registrate - fatte, perc };
}
function presenzePerMese(a) {
  const map = new Map();
  for (const p of a.presenze) {
    const k = monthKey(p.data);
    if (!map.has(k)) map.set(k, { presenti: 0, totali: 0 });
    const m = map.get(k);
    m.totali++;
    if (p.presente) m.presenti++;
  }
  return [...map.entries()].sort((x, y) => x[0] < y[0] ? -1 : 1)
    .map(([k, v]) => {
      const [y, m] = k.split("-");
      return { label: MESI[+m - 1] + " " + y.slice(2), ...v, key: k };
    });
}

let MODAL = null;
let _closeTimer = null;
function closeModal() {
  const root = document.getElementById("modalRoot");
  const veil = root.querySelector(".modal-veil");
  MODAL = null;
  if (!veil || veil.classList.contains("closing")) return;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { root.innerHTML = ""; return; }
  veil.classList.add("closing");
  veil.querySelector(".modal")?.classList.add("closing");
  clearTimeout(_closeTimer);
  _closeTimer = setTimeout(() => { root.innerHTML = ""; }, 140);
}
function openModal(cfg) {
  clearTimeout(_closeTimer);
  MODAL = cfg;
  const f = cfg.fields || [];
  const html = `
  <div class="modal-veil" data-veil="1">
    <div class="modal" role="dialog" aria-modal="true" aria-label="${esc(cfg.title)}">
      <div class="row">
        <h3 class="grow">${esc(cfg.title)}</h3>
        <button class="iconbtn" data-close="1" aria-label="Chiudi">${ic("x")}</button>
      </div>
      ${cfg.info ? `<p class="small">${cfg.info}</p>` : ""}
      <form id="modalForm" class="stack">
        ${f.map(fieldHTML).join("")}
        <div class="modal-actions">
          ${cfg.danger ? `<button type="button" class="btn danger" data-danger="1">${esc(cfg.danger.label)}</button>` : ""}
          <span style="flex:1"></span>
          <button type="button" class="btn" data-close="1">Annulla</button>
          <button type="submit" class="btn primary">${esc(cfg.saveLabel || "Salva")}</button>
        </div>
      </form>
    </div>
  </div>`;
  const root = document.getElementById("modalRoot");
  root.innerHTML = html;

  root.querySelector(".modal-veil").addEventListener("click", e => {
    if (e.target.dataset.veil) closeModal();
  });
  root.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModal));
  if (cfg.danger) root.querySelector("[data-danger]").addEventListener("click", () => {
    closeModal(); cfg.danger.fn();
  });
  root.querySelector("#modalForm").addEventListener("submit", e => {
    e.preventDefault();
    const vals = {};
    for (const fl of f) {
      if (fl.type === "checkgroup") {
        vals[fl.key] = [...root.querySelectorAll(`[data-cg="${fl.key}"]:checked`)].map(i => i.value);
      } else if (fl.type === "checkbox") {
        vals[fl.key] = root.querySelector(`[name="${fl.key}"]`).checked;
      } else {
        const el = root.querySelector(`[name="${fl.key}"]`);
        vals[fl.key] = el ? el.value.trim() : "";
        if (fl.required && !vals[fl.key]) {
          el.style.borderColor = "var(--bad)";
          const box = el.closest(".field");
          if (box && !box.querySelector(".err")) {
            const msg = document.createElement("div");
            msg.className = "err";
            msg.setAttribute("role", "alert");
            msg.textContent = "Questo campo è obbligatorio";
            box.appendChild(msg);
            el.addEventListener("input", () => {   // l'errore sparisce appena si scrive
              el.style.borderColor = "";
              msg.remove();
            }, { once: true });
          }
          el.focus();
          return;
        }
        if (fl.type === "number") vals[fl.key] = vals[fl.key] === "" ? null : +vals[fl.key];
      }
    }
    closeModal();
    cfg.onSave(vals);
  });
  const first = root.querySelector("input,textarea,select");
  if (first && window.innerWidth > 680) first.focus();
}
function fieldHTML(f) {
  const v = f.value ?? "";

    return `<div class="field"><label>${esc(f.label)}</label><textarea name="${f.key}" rows="${f.rows || 5}" placeholder="${esc(f.placeholder || "")}">${esc(v)}</textarea></div>`;
  if (f.type === "select")
    return `<div class="field"><label>${esc(f.label)}</label><select name="${f.key}">${(f.options || []).map(o => `<option value="${esc(o.v)}" ${String(o.v) === String(v) ? "selected" : ""}>${esc(o.t)}</option>`).join("")}</select></div>`;
  if (f.type === "checkbox")
    return `<label class="checkrow"><input type="checkbox" name="${f.key}" ${v ? "checked" : ""}> ${esc(f.label)}</label>`;
  if (f.type === "checkgroup")
    return `<div class="field"><label>${esc(f.label)}</label>${(f.options || []).map(o =>
      `<label class="checkrow"><input type="checkbox" data-cg="${f.key}" value="${esc(o.v)}" ${f.value && f.value.includes(o.v) ? "checked" : ""}> ${esc(o.t)}</label>`).join("")}</div>`;
  return `<div class="field"><label>${esc(f.label)}${f.required ? " *" : ""}</label><input name="${f.key}" type="${f.type || "text"}" value="${esc(v)}" placeholder="${esc(f.placeholder || "")}" ${f.min != null ? `min="${f.min}"` : ""} ${f.step ? `step="${f.step}"` : ""}></div>`;
}

/* Anello di avanzamento: presenze fatte vs contratto */
function donutHTML(fatte, contratto) {
  const perc = contratto > 0 ? fatte / contratto : 0;
  const shown = Math.min(perc, 1);
  const R = 52, C = 2 * Math.PI * R;
  const off = C * (1 - shown);
  const over = perc > 1;
  const assenze = Math.max(contratto - fatte, 0);
  const stat = (label, val) => `
    <div><div class="eyebrow">${label}</div><div class="k num" style="font-size:26px">${val}</div></div>`;
  return `
  <div class="row" style="gap:22px;justify-content:center;flex-wrap:wrap">
    <svg width="140" height="140" viewBox="0 0 130 130" role="img"
         aria-label="Presenze: ${fatte} su ${contratto} da contratto">
      <circle cx="65" cy="65" r="${R}" fill="none" stroke="var(--surface-3)" stroke-width="13"/>
      <circle cx="65" cy="65" r="${R}" fill="none" class="donut-progress" style="--donut-c:${C}"
              stroke="${over ? "var(--warn)" : "var(--chart-1)"}" stroke-width="13"
              stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"
              transform="rotate(-90 65 65)"/>
      <text x="65" y="61" text-anchor="middle"
            style="font:800 26px var(--font-display);fill:var(--ink)">${Math.round(perc * 100)}%</text>
      <text x="65" y="80" text-anchor="middle"
            style="font:500 11px var(--font-data);fill:var(--ink-3);letter-spacing:.02em">${fatte}/${contratto}</text>
    </svg>
    <div class="stack" style="gap:10px;min-width:110px">
      ${stat("Fatte", fatte)}
      ${stat("Assenze", assenze)}
      ${stat("Contratto", contratto)}
    </div>
  </div>`;
}

/* Barre mensili impilate: presenze e assenze */
function barChartHTML(mesi) {
  if (!mesi.length) return `<div class="empty">Nessuna presenza registrata: aggiungile dal registro qui sotto.</div>`;
  const W = 660, H = 210, padL = 30, padB = 26, padT = 14;
  const iw = W - padL - 8, ih = H - padT - padB;
  const max = Math.max(...mesi.map(m => m.totali), 4);
  const yTicks = 3;
  const bw = Math.min(34, iw / mesi.length * 0.62);
  const step = iw / mesi.length;
  let bars = "", grid = "", labels = "";
  for (let t = 1; t <= yTicks; t++) {
    const val = Math.round(max / yTicks * t);
    const y = padT + ih - ih * (val / max);
    grid += `<line x1="${padL}" x2="${W - 6}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>
             <text x="${padL - 6}" y="${y + 3.5}" text-anchor="end" style="font:600 10px var(--font);fill:var(--ink-3)" class="num">${val}</text>`;
  }
  mesi.forEach((m, i) => {
    const x = padL + step * i + (step - bw) / 2;
    const hP = ih * (m.presenti / max);
    const hA = ih * ((m.totali - m.presenti) / max);
    const yP = padT + ih - hP;
    const yA = yP - (hA > 0 ? hA + 2 : 0);
    const tip = `${m.label}: ${m.presenti} presenze` + (m.totali - m.presenti ? `, ${m.totali - m.presenti} assenze` : "");
    bars += `<g class="bar" data-tip="${esc(tip)}" style="animation-delay:${Math.min(i, 10) * 35}ms">
      <rect x="${x - 4}" y="${padT}" width="${bw + 8}" height="${ih}" fill="transparent"/>
      ${hP > 0 ? `<path d="M${x} ${padT + ih} V${yP + 4} Q${x} ${yP} ${x + 4} ${yP} H${x + bw - 4} Q${x + bw} ${yP} ${x + bw} ${yP + 4} V${padT + ih} Z" fill="var(--chart-1)"/>` : ""}
      ${hA > 1 ? `<rect x="${x}" y="${yA}" width="${bw}" height="${hA}" rx="3" fill="var(--surface-3)" stroke="var(--line)"/>` : ""}
    </g>`;
    const every = mesi.length > 9 ? 2 : 1;
    if (i % every === 0)
      labels += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle" style="font:600 10px var(--font);fill:var(--ink-3)">${esc(m.label)}</text>`;
  });
  return `
  <div class="chartbox">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Andamento mensile delle presenze">
      ${grid}
      <line x1="${padL}" x2="${W - 6}" y1="${padT + ih}" y2="${padT + ih}" stroke="var(--ink-3)" stroke-width="1.2"/>
      ${bars}${labels}
    </svg>
    <div class="tooltip"></div>
    <div class="legend" style="margin-top:6px">
      <span><i style="background:var(--chart-1)"></i>Presenze</span>
      <span><i style="background:var(--surface-3);border:1px solid var(--line)"></i>Assenze</span>
    </div>
  </div>`;
}

/* Legge un'immagine, la ridimensiona e la restituisce come dataURI (per non riempire la memoria) */
function readImageFile(file, maxSide, cb) {
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, maxSide / Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = Math.max(1, Math.round(img.width * k));
      cv.height = Math.max(1, Math.round(img.height * k));
      const ctx = cv.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.drawImage(img, 0, 0, cv.width, cv.height);
      cb(cv.toDataURL("image/jpeg", 0.84));
    };
    img.onerror = () => toast("Immagine non leggibile");
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}

/* tooltip dei grafici (delegato, funziona anche al tocco) */
function bindCharts(rootEl) {
  rootEl.querySelectorAll(".chartbox").forEach(box => {
    const tip = box.querySelector(".tooltip");
    if (!tip) return;
    const show = (bar, ev) => {
      tip.textContent = bar.dataset.tip;
      tip.style.display = "block";
      const r = box.getBoundingClientRect();
      const br = bar.getBoundingClientRect();
      tip.style.left = (br.left - r.left + br.width / 2) + "px";
      tip.style.top = (br.top - r.top + 6) + "px";
    };
    box.addEventListener("pointerover", e => {
      const bar = e.target.closest(".bar");
      if (bar) show(bar, e); else tip.style.display = "none";
    });
    box.addEventListener("pointerleave", () => tip.style.display = "none");
    box.addEventListener("click", e => {
      const bar = e.target.closest(".bar");
      if (bar) show(bar, e);
    });
  });
}

/* immagini (locandine, foto degli allenatori): chi ha la classe .imgsk
   mostra il riquadro grigio finché la sua foto non è pronta */
function bindImgSk(rootEl) {
  rootEl.querySelectorAll("img[data-sk]").forEach(img => {
    const box = img.closest(".imgsk");
    if (!box) return;
    const fatto = () => box.classList.add("ok");
    if (img.complete && img.naturalWidth > 0) { fatto(); return; }
    img.addEventListener("load", fatto, { once: true });
    img.addEventListener("error", fatto, { once: true });   // anche se fallisce, via il grigio
  });
}

});
/* le card cliccabili sono <div data-act="..." tabindex="0" role="button">, non <button>:
   senza questo, Invio/Spazio da tastiera non le attivano (il click del mouse funziona già
   tramite il listener sopra, "el.click()" lo riusa senza duplicare la logica). */
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const el = e.target.closest("[data-act]");
  if (!el || ["BUTTON", "A", "INPUT", "TEXTAREA", "SELECT"].includes(el.tagName)) return;
  e.preventDefault();
  el.click();
});

/* ---------- routing con hash: deep link + tasto indietro del telefono ---------- */
function viewToHash(v) {
  const parts = [v.name];
  if (v.id) parts.push(v.id);
  if (v.name === "diario") parts.push(v.cat, v.tipo);
  return "#/" + parts.join("/");
}
function hashToView(h) {
  const p = (h || "").replace(/^#\/?/, "").split("/").filter(Boolean);
  const name = p[0] || "home";
  const ok = {
    home: () => ({ name: "home" }),
    mio: () => ({ name: "mio" }),
    categorie: () => ({ name: "categorie" }),
    categoria: () => getCat(p[1]) && { name: "categoria", id: p[1] },
    diario: () => getCat(p[1]) && DIARIO_TIPI.some(t => t.key === p[2]) && { name: "diario", cat: p[1], tipo: p[2] },
    allenatori: () => ({ name: "allenatori" }),
    allenatore: () => getCoach(p[1]) && { name: "allenatore", id: p[1] },
    partite: () => ({ name: "partite" }),
    partita: () => S.partite.some(x => x.id === p[1]) && { name: "partita", id: p[1] },
    eventi: () => ({ name: "eventi" }),
    evento: () => S.eventi.some(x => x.id === p[1]) && { name: "evento", id: p[1] },
    contatti: () => ({ name: "contatti" }),
    impostazioni: () => ({ name: "impostazioni" })
  };
  return (ok[name] && ok[name]()) || { name: "home" };
}
let _hashInterno = false;

/* ---------- caricamento ----------
   caricaVista() è il punto in cui un domani si andranno a chiedere i dati al
   server: se restituisce un'attesa, prima si mostra lo scheletro e poi la
   schermata vera. Oggi i dati sono già sul dispositivo, quindi l'attesa è zero
   e non si vede nessun ritardo; la prova in Impostazioni serve solo a guardare
   come vengono gli scheletri. */
let _attesa = null;
function tempoCaricamento() { return Number(S.settings.provaCaricamento) || 0; }
function caricaVista(v, poi) {
  clearTimeout(_attesa);
  const ms = tempoCaricamento();
  if (ms <= 0) { poi(); return; }
  mostraScheletro(v);
  _attesa = setTimeout(() => { if (VIEW === v) poi(); }, ms);
}
function mostraScheletro(v) {
  renderChrome();
  const main = document.getElementById("main");
  main.setAttribute("aria-busy", "true");
  main.classList.remove("anim");
  main.innerHTML = skeletonHTML(v.name);
}

function go(v) {
  VIEW = v;
  const h = viewToHash(v);
  if (location.hash !== h) { _hashInterno = true; location.hash = h; }
  window.scrollTo(0, 0);
  caricaVista(v, render);
}
window.addEventListener("hashchange", () => {
  if (_hashInterno) { _hashInterno = false; return; }
  if (MODAL) closeModal();
  VIEW = hashToView(location.hash);
  caricaVista(VIEW, render);
});
ACT.go = arg => go(JSON.parse(arg));

/* striscia dei 7 giorni da oggi in poi, iniziali italiane (L M M G V S D):
   oggi in navy, il giorno della prossima partita in verde, gli altri neutri. */
function settimanaFiglioHTML(dataProssima) {
  const GIORNI = ["L", "M", "M", "G", "V", "S", "D"]; // lun..dom
  const oggi = todayISO();
  let html = "";
  for (let i = 0; i < 7; i++) {
    const d = new Date(oggi + "T00:00:00");
    d.setDate(d.getDate() + i);
    const iso = isoLocal(d);
    const idx = (d.getDay() + 6) % 7;
    const cls = iso === oggi ? "oggi" : (iso === dataProssima ? "match" : "");
    html += `<div class="figlio-giorno ${cls}">${GIORNI[idx]}</div>`;
  }
  return html;
}

/* la scheda vive in #figlioRoot, fuori dal ciclo di render(), come i modali: cosi le sue
   animazioni non vengono interrotte se qualcos'altro nell'app chiama render() nel frattempo. */
let _figlioTimer = null;
function apriFiglio(id) {
  clearTimeout(_figlioTimer);
  _figlioAperto = id;
  const root = document.getElementById("figlioRoot");
  root.innerHTML = `<div class="figlio-drawer">
    <div class="figlio-maniglia" data-act="figlioChiudi" role="button" tabindex="0" aria-label="Chiudi la scheda"><span></span></div>
    <div class="figlio-drawer-inner" id="figlioInner">${figlioContenutoHTML(id)}</div>
  </div>`;
  const el = root.querySelector(".figlio-drawer");
  void el.offsetWidth;   // forza il disegno alla posizione di partenza prima di animare l'ingresso
  el.classList.add("aperta");
  bindFiglioGesti(el);
}
function chiudiFiglio() {
  const root = document.getElementById("figlioRoot");
  const el = root.querySelector(".figlio-drawer");
  if (!el) return;
  _figlioAperto = null;
  el.classList.remove("aperta");
  el.classList.add("uscita");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { root.innerHTML = ""; return; }
  clearTimeout(_figlioTimer);
  _figlioTimer = setTimeout(() => { root.innerHTML = ""; }, 420);
}
function cambiaFiglio() {
  if (!_figlioAperto) return;
  _figlioAperto = _figlioAperto === "leo" ? "sofia" : "leo";
  const inner = document.getElementById("figlioInner");
  if (!inner) return;
  inner.innerHTML = figlioContenutoHTML(_figlioAperto);
  bindFiglioGesti(inner.closest(".figlio-drawer"));
}
/* trascinare in verticale chiude (segue il dito, come "a tendina"); in orizzontale cambia
   figlio solo al rilascio, se il gesto supera 70px — esattamente come nel prototipo. */
function bindFiglioGesti(el) {
  if (!el) return;
  let drag = null;
  el.onpointerdown = e => {
    if (!el.classList.contains("aperta")) return;
    drag = { x0: e.clientX, y0: e.clientY, modo: null, dy: 0 };
    el.setPointerCapture?.(e.pointerId);
  };
  el.onpointermove = e => {
    if (!drag) return;
    const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    if (!drag.modo) {
      if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
      drag.modo = Math.abs(dy) > Math.abs(dx) ? "chiudi" : "cambia";
    }
    drag.dx = dx; drag.dy = dy;
    if (drag.modo === "chiudi") {
      el.style.transition = "none";
      el.style.transform = `translateY(${dy > 0 ? dy * .85 : dy * .35}px)`;
    }
  };
  const fine = () => {
    if (!drag) return;
    const d = drag; drag = null;
    el.style.transition = ""; el.style.transform = "";
    if (d.modo === "chiudi" && Math.abs(d.dy) > 70) { chiudiFiglio(); return; }
    if (d.modo === "cambia" && Math.abs(d.dx) > 70) cambiaFiglio();
  };
  el.onpointerup = fine;
  el.onpointercancel = fine;
}
ACT.figlioApri = id => apriFiglio(id);
