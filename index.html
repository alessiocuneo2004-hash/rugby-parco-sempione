ACT.figlioCambia = () => cambiaFiglio();
/* prossimi appuntamenti mostrati in home: tornei del club + partite programmate */
function appuntamentiHome() {
  const oggi = todayISO();
  const voci = [];
  for (const t of torneiInArrivo()) {
    voci.push({
      data: t.data, titolo: t.nome,
      sotto: [t.cats.map(c => c.nome).join(", "), t.luogo].filter(Boolean).join(" · ")
    });
  }
  for (const p of S.partite) {
    if (p.stato !== "programmata" || p.data < oggi) continue;
    // se la partita e la giornata di un torneo gia in elenco, non ripeterla:
    // meglio una voce sola che porta alla partita (collegaTorneo vince sul nome, vedi
    // impegniInArrivo in fondo al file)
    const gia = voci.findIndex(v => p.collegaTorneo
      ? (v.titolo + "|" + v.data) === p.collegaTorneo
      : v.data === p.data && v.titolo === p.avversario);
    const voce = {
      data: p.data, titolo: nomeCat(p.categoria) + " — " + p.avversario,
      sotto: [p.luogo, p.ora].filter(Boolean).join(" · "),
      vai: { name: "partita", id: p.id }
    };
    if (gia >= 0) voci[gia] = voce; else voci.push(voce);
  }
  // giorno e mese li formatta dataGrande() al momento del disegno
  return voci.sort((a, b) => a.data < b.data ? -1 : 1).slice(0, 4);
}

/* blocco data: giorno grande in Big Shoulders + mese in Chivo sotto (riga appuntamento
   del design system). Usato in Home, elenco Tornei e tornei della categoria. */
function dataGrande(iso) {

function pillCat(cid, vai, sigla) {
  const c = getCat(cid);
  if (!c) return `<span class="pill">—</span>`;
  const tinta = coloreCat(c, S.categorie.indexOf(c));
  const arg = vai ? ` data-act="go" data-arg="${esc(JSON.stringify({ name: "categoria", id: c.id }))}" role="button" tabindex="0"` : "";
  return `<span class="pill${vai ? " clickable" : ""}" style="background:${tinta};color:${inkSuColore(tinta)}"${arg}>${esc(sigla ? siglaCat(c) : c.nome)}</span>`;
}
function inkSuColore(hex) {
  const v = c => { c /= 255; return c <= .03928 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4); };
  const r = parseInt(hex.substr(1, 2), 16), g = parseInt(hex.substr(3, 2), 16), b = parseInt(hex.substr(5, 2), 16);
  const L = .2126 * v(r) + .7152 * v(g) + .0722 * v(b);
  return L > .42 ? "#0B1B26" : "#FFFFFF";
}

   ===================================================================== */
/* unisce tornei e partite programmate in un solo elenco ordinato per data.
   Quando un torneo e una partita coincidono (stessa data e stesso nome) tiene la
   partita, perche da li si aprono punteggio e convocati. */
function impegniInArrivo(tornei, partite) {
  const voci = tornei.map(t => ({ data: t.data, torneo: t }));
  for (const p of partite) {
    // il collegamento esplicito (collegaTorneo) vince sempre: il nome dell'avversario può
    // benissimo essere diverso dal nome del torneo (es. "Rugby Monza" al "Torneo Città di
    // Monza") senza che sia un doppione da unire per caso.
    const i = voci.findIndex(v => v.torneo && (p.collegaTorneo
      ? (v.torneo.nome + "|" + v.torneo.data) === p.collegaTorneo
      : v.data === p.data && v.torneo.nome === p.avversario));
    const voce = { data: p.data, partita: p };
    if (i >= 0) voci[i] = voce; else voci.push(voce);
  }
  return voci.sort((a, b) => a.data < b.data ? -1 : 1);
}

function vPartite() {
  const filtro = VIEW.cat || "all";
  const oggi = todayISO();
  const match = S.partite.filter(p => filtro === "all" || p.categoria === filtro);
  // il giorno del torneo tutte le sue partite stanno in cima, live per prime
  const inCampo = match
    .filter(p => p.stato === "in_corso" || p.data === oggi)
    .sort((a, b) =>
      (a.stato === "in_corso" ? 0 : 1) - (b.stato === "in_corso" ? 0 : 1) ||
      ((a.ora || "") < (b.ora || "") ? -1 : 1));
  const inCampoIds = new Set(inCampo.map(p => p.id));
  const prossime = match.filter(p => p.stato === "programmata" && !inCampoIds.has(p.id)).sort((a, b) => a.data < b.data ? -1 : 1);
  const finite = match.filter(p => p.stato === "terminata" && !inCampoIds.has(p.id)).sort((a, b) => a.data < b.data ? 1 : -1);

  const matchCard = p => {
    const isLive = p.stato === "in_corso";
    const done = p.stato === "terminata";
    const esito = done ? (p.puntiNoi > p.puntiLoro ? "good" : p.puntiNoi < p.puntiLoro ? "bad" : "warn") : "";
    return `
    <div class="card clickable" data-act="go" data-arg="${esc(JSON.stringify({ name: "partita", id: p.id }))}" role="button" tabindex="0">
      <div class="row" style="flex-wrap:wrap;gap:6px">
        ${pillCat(p.categoria, false, true)}
        <span class="grow"></span>
        ${isLive ? `<span class="pill live">LIVE</span>` : `<span class="muted num quando">${fmtDate(p.data, false)}${p.ora ? " · " + esc(p.ora) : ""}</span>`}
      </div>
      <div class="row" style="margin-top:10px">
        <div class="grow">
          <div class="title" style="font-size:16.5px;font-weight:800">${esc(S.settings.club.replace("Rugby ", ""))} — ${esc(p.avversario)}</div>
          <div class="muted">${ic("place", "icon-inline")}${esc(p.luogo)}</div>
        </div>
        ${(isLive || done) ? `
        <div class="score" style="flex:none">
          <span class="pts" style="color:${isLive ? "var(--live)" : "var(--ink)"}">${p.puntiNoi ?? 0}</span>
          <span class="sep">–</span>
          <span class="pts" style="color:${isLive ? "var(--live)" : "var(--ink)"}">${p.puntiLoro ?? 0}</span>
        </div>
        ${done ? `<span class="pill ${esito}">${esito === "good" ? "Vittoria" : esito === "bad" ? "Sconfitta" : "Pareggio"}</span>` : ""}` :
        `<span class="pill num">${p.convocati.length ? p.convocati.length + " convocati" : "Da convocare"}</span>`}
      </div>
    </div>`;
  };

  /* riga uniforme dell'elenco "Prossimi tornei": stesso blocco data, stesso titolo,
     sotto solo l'icona del luogo e il luogo — sia per un torneo puro sia per una
     partita già in calendario (che resta cliccabile verso punteggio e convocati). */
  const impegnoCard = x => {
    const p = x.partita, t = x.torneo;
    const nome = p ? p.avversario : t.nome;
    const luogo = p ? p.luogo : (t.luogo || "Luogo da definire");
    const cats = p ? [getCat(p.categoria)].filter(Boolean) : t.cats;
    const vai = p ? ` data-act="go" data-arg="${esc(JSON.stringify({ name: "partita", id: p.id }))}" role="button" tabindex="0"` : "";
    return `
    <div class="card list-row torneo-card${p ? " clickable" : ""}"${vai}>
      ${dataGrande(x.data)}
      <div class="grow">
        <div class="title">${esc(nome)}</div>
        <div class="muted">${ic("place", "icon-inline")}${esc(luogo)}</div>
      </div>
      <div class="row cats">
        ${cats.map(c => pillCat(c.id, true, true)).join("")}
      </div>

  };

  const tornei = torneiInArrivo().filter(t => filtro === "all" || t.cats.some(c => c.id === filtro));

  return `<div class="stack-lg">
    <div class="row">
      <div class="grow">
        <h1 class="page-title">Tornei</h1>
      </div>
      ${can("partite") ? btnAdd("Partita", "matchEdit", "") : ""}
    </div>
    <div class="chips">
      <button class="chip ${filtro === "all" ? "on" : ""}" data-act="matchFiltro" data-arg="all">Tutte</button>
      ${S.categorie.map(c => `<button class="chip ${filtro === c.id ? "on" : ""}" data-act="matchFiltro" data-arg="${c.id}">${esc(c.nome)}</button>`).join("")}

    ${inCampo.length ? `
    <div>
      <div class="sec-head"><h2>Oggi in campo</h2></div>
      <div class="stack">${inCampo.map(matchCard).join("")}</div>
    </div>` : ""}

    ${/* un elenco solo: tornei e partite insieme, in ordine di data. Se un torneo ha gia
         la sua partita, si mostra la partita (che porta a punteggio e convocati). */""}
    <div>
      <div class="sec-head"><h2>Prossimi tornei</h2></div>
      <div class="stack">
        ${impegniInArrivo(tornei, prossime).map(impegnoCard).join("")
          || `<div class="empty">Nessun impegno in programma${filtro !== "all" ? " per questa categoria" : ""}.</div>`}
      </div>
    </div>
    <div>
      <div class="sec-head"><h2>Risultati</h2></div>
      <div class="stack">${finite.map(matchCard).join("") || `<div class="empty">Ancora nessun risultato.</div>`}</div>
    </div>
  </div>`;
}

function vPartita(id) {

  return `<div class="stack-lg">
    <div class="stack" style="gap:16px">
      <div class="row">
        <h1 class="page-title grow">Partita</h1>
        ${editable ? btnIcon("edit", "matchEdit", p.id, "", "Modifica dati partita") : ""}
      </div>
      <div class="row" style="flex-wrap:wrap;gap:6px">
        ${pillCat(p.categoria)}
        <span class="pill round">${esc(p.tipo)}</span>

    </div>

      <div class="tabellone">
        <div>
          <div class="squadra">${esc(S.settings.club.replace("Rugby ", ""))}</div>
          ${scoreBtns("noi")}
        </div>

          <div class="squadra">${esc(p.avversario)}</div>

      ${p.puntiNoi == null ? `<div class="muted" style="color:var(--live-muted);margin-top:6px">Non ancora iniziata</div>` : ""}

        ${isLive ? `<button class="btn small danger" data-act="matchStato" data-arg="${esc(JSON.stringify({ id: p.id, stato: "terminata" }))}">Fischio finale</button>` : ""}
      </div>` : ""}

    </div>

    <div>
      <div class="sec-head">
        <h2>Informazioni</h2>
        ${canInfoPartita() ? btnAdd("Aggiungi", "infoEdit", JSON.stringify({ match: p.id })) : ""}
      </div>
      <div class="stack" style="gap:10px">
        ${[...p.info].sort((a, b) => a.quando < b.quando ? 1 : -1).map(i => `
          <div class="card" style="background:var(--surface-2);padding:12px 14px">
            <div class="row">
              ${ic("info", "icon-inline")}
              <span class="muted num">${fmtDate(i.quando.slice(0, 10))} · ${esc(i.quando.slice(11, 16))}</span>
              <span class="pill blue">${esc(i.autore)}</span>
              <span class="grow"></span>
              ${canInfoPartita() ? btnIcon("edit", "infoEdit", JSON.stringify({ match: p.id, id: i.id }), "", "Modifica") + btnIcon("trash", "infoDel", JSON.stringify({ match: p.id, id: i.id }), "danger", "Elimina") : ""}
            </div>
            ${longText(i.testo, "margin-top:5px")}
          </div>`).join("") ||
          `<div class="empty">Nessuna informazione per questa partita.${canInfoPartita() ? " Qui lo staff può scrivere avvisi per genitori e squadra: ritrovo, cosa portare, variazioni." : ""}</div>`}
      </div>
    </div>

    <div>
      <div class="sec-head">
        <h2>Convocazioni</h2>
        ${editable ? btnAdd("Extra rosa", "convExtra", p.id) : ""}
      </div>
      ${cat && cat.rosa.length ? `
      <div class="card stack" style="gap:2px">
        ${cat.rosa.map(g => {
          const on = p.convocati.includes(g.nome);
          return editable ? `
          <label class="checkrow">
            <input type="checkbox" ${on ? "checked" : ""} data-act="convToggle" data-arg="${esc(JSON.stringify({ id: p.id, nome: g.nome }))}">
            ${esc(g.nome)}
          </label>` : (on ? `<div class="list-row"><span class="pill good">✓</span>${esc(g.nome)}</div>` : "");
        }).join("")}
        ${p.convocati.filter(n => !cat.rosa.some(g => g.nome === n)).map(n => `
          <div class="checkrow"><span class="pill blue">extra</span>${esc(n)}
            ${editable ? `<button class="iconbtn" style="margin-left:auto" data-act="convToggle" data-arg="${esc(JSON.stringify({ id: p.id, nome: n }))}" aria-label="Rimuovi">${ic("x")}</button>` : ""}
          </div>`).join("")}
      </div>` :
      `<div class="empty">La rosa di ${esc(cat ? cat.nome : "questa categoria")} è vuota: aggiungi i giocatori dalla pagina della categoria per poterli convocare.</div>`}
    </div>
  </div>`;
}
ACT.score = arg => {
  if (!canLive()) return;
  const { id, side, n } = JSON.parse(arg);
  const p = S.partite.find(x => x.id === id);
  if (navigator.vibrate) navigator.vibrate(8);   // feedback tattile sul punto segnato
  if (p.stato === "programmata") p.stato = "in_corso";
  if (side === "noi") p.puntiNoi = Math.max(0, (p.puntiNoi ?? 0) + n);
  else p.puntiLoro = Math.max(0, (p.puntiLoro ?? 0) + n);
  save(); render();
};
ACT.matchStato = arg => {
  if (!canLive()) return;
  const { id, stato } = JSON.parse(arg);
  const p = S.partite.find(x => x.id === id);
  const applica = () => {
    p.stato = stato;
    if (stato === "programmata") { p.puntiNoi = null; p.puntiLoro = null; }
    else { p.puntiNoi = p.puntiNoi ?? 0; p.puntiLoro = p.puntiLoro ?? 0; }
    save(); render();
    toast(stato === "in_corso" ? "Partita in corso — aggiorna il punteggio in tempo reale" : stato === "terminata" ? "Risultato registrato" : "Stato annullato");
  };
  // "Annulla" cancella il punteggio: se c'è già un risultato segnato, un tocco sbagliato
  // con le mani fredde non deve poterlo cancellare senza chiedere conferma.
  const haPunteggio = (p.puntiNoi ?? 0) > 0 || (p.puntiLoro ?? 0) > 0;
  if (stato === "programmata" && haPunteggio) {
    confirmModal(`Annullare la partita? Il punteggio attuale (${p.puntiNoi}–${p.puntiLoro}) andrà perso.`, applica);
  } else {
    applica();
  }
};
ACT.infoEdit = arg => {
  const { match, id } = JSON.parse(arg);
  const p = S.partite.find(x => x.id === match);
  const i0 = p.info.find(x => x.id === id);
  openModal({
    title: i0 ? "Modifica informazione" : "Nuova informazione",
    info: "Visibile a tutti, genitori compresi.",
    fields: [{ key: "testo", label: "Testo", type: "textarea", rows: 4, value: i0?.testo, placeholder: "es. Ritrovo ore 8:15 al campo, portare la borraccia", required: true }],
    onSave: v => {
      if (i0) Object.assign(i0, { testo: v.testo });
      else {
        const now = new Date();
        const ora = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
        p.info.push({ id: uid(), testo: v.testo, quando: isoLocal(now) + "T" + ora, autore: ruoloCorrente().nome });
      }
      save(); render(); toast("Informazione pubblicata");
    }
  });
};
ACT.infoDel = arg => {
  const { match, id } = JSON.parse(arg);
  confirmModal("Eliminare questa informazione?", () => {
    const p = S.partite.find(x => x.id === match);
    p.info = p.info.filter(x => x.id !== id);
    save(); render();
  });
};
ACT.convToggle = arg => {
  const { id, nome } = JSON.parse(arg);
  const p = S.partite.find(x => x.id === id);
  if (p.convocati.includes(nome)) p.convocati = p.convocati.filter(n => n !== nome);
  else p.convocati.push(nome);
  save(); render();
};
ACT.convExtra = id => {
  const p = S.partite.find(x => x.id === id);
  openModal({
    title: "Convoca fuori rosa",
    info: "Per giocatori di un'altra categoria o ospiti.",
    fields: [{ key: "nome", label: "Nome giocatore", required: true }],
    onSave: v => {
      if (!p.convocati.includes(v.nome)) p.convocati.push(v.nome);
      save(); render();
    }
  });
};
ACT.matchEdit = id => {
  const p = S.partite.find(x => x.id === id);
  openModal({
    title: p ? "Modifica partita" : "Nuova partita",
    fields: [
      { key: "categoria", label: "Categoria", type: "select", value: p?.categoria || S.categorie[0].id, options: S.categorie.map(c => ({ v: c.id, t: c.nome })) },
      { key: "avversario", label: "Avversario / evento", value: p?.avversario, required: true },
      {
        key: "collegaTorneo", label: "Torneo collegato (facoltativo)", type: "select", value: p?.collegaTorneo || "",
        options: (() => {
          const prossimi = torneiInArrivo().map(t => ({ v: t.nome + "|" + t.data, t: t.nome + " — " + fmtDate(t.data) }));
          // se la partita era già collegata a un torneo ormai passato, tienilo in lista:
          // altrimenti salvare senza toccare il campo lo scollegherebbe senza volerlo
          const passato = p?.collegaTorneo && !prossimi.some(o => o.v === p.collegaTorneo)
            ? [{ v: p.collegaTorneo, t: p.collegaTorneo.split("|")[0] + " (passato)" }] : [];
          return [{ v: "", t: "Nessuno — partita singola" }, ...prossimi, ...passato];
        })()
      },
      { key: "data", label: "Data", type: "date", value: p?.data || todayISO(), required: true },
      { key: "ora", label: "Ora", type: "time", value: p?.ora || "10:00" },
      { key: "luogo", label: "Luogo", value: p?.luogo || "Campo Parco Sempione" },
      { key: "casa", label: "Partita in casa", type: "checkbox", value: p ? p.casa : true },
      { key: "tipo", label: "Tipo", type: "select", value: p?.tipo || "Campionato", options: ["Campionato", "Torneo", "Amichevole", "Raggruppamento"].map(t => ({ v: t, t })) },
      { key: "note", label: "Note", type: "textarea", rows: 3, value: p?.note }
    ],
    danger: p && can("partite") ? {
      label: "Elimina",
      fn: () => confirmModal("Eliminare questa partita?", () => {
        S.partite = S.partite.filter(x => x.id !== p.id);
        save(); go({ name: "partite" });
      })
    } : null,
    onSave: v => {
      if (p) Object.assign(p, v);
      else S.partite.push({ id: uid(), ...v, stato: "programmata", puntiNoi: null, puntiLoro: null, convocati: [] });
      save(); render(); toast("Partita salvata");
    }
  });
};

/* =====================================================================
   RENDER
   ===================================================================== */
function applyTheme() {
  const t = S.settings.tema;
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
}
function renderLogo() {
  const wm = document.getElementById("watermark");
  if (wm && !wm.src) wm.src = LOGO_FIRMA;
}
const MENU_BTN = `<button class="iconbtn" id="menuBtn" data-act="toggleTendina" aria-label="Apri il menu" aria-expanded="false">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
</button>`;
/* pastiglia del livello: solo la sigla (L1, L2...), senza nome — apre "La mia area", dove
   ora vive anche il cambio ruolo (un domani lì si potrà anche mettere una foto). */
function rolePillHTML(r) {
  return `<button class="role-pill" data-act="go" data-arg="${esc(JSON.stringify({ name: "mio" }))}" title="Vai alla tua area">
    <span class="lvl ${r.livello === 1 ? "l1" : ""}">L${r.livello}</span>
  </button>`;
}
/* intestazione principale: marchio del club, oppure il profilo (La mia area),
   oppure indietro + titolo dell'elemento aperto nelle schermate di dettaglio */
function headerMainHTML(r) {
  const back = (target, titolo, eyebrow) => `
    ${MENU_BTN}
    <button class="iconbtn back-chip" data-act="go" data-arg="${esc(JSON.stringify(target))}" aria-label="Indietro">${ic("left")}</button>
    <div class="brand">
      ${titolo ? `<div class="club-name">${esc(titolo)}</div>` : ""}
      ${eyebrow ? `<div class="club-sub">${esc(eyebrow)}</div>` : ""}
    </div>
    <div class="spacer"></div>
    ${rolePillHTML(r)}`;
  switch (VIEW.name) {
    case "mio": {
      const a = getCoach(S.settings.profiloAllenatore);
      return `
        ${MENU_BTN}
        <div class="logo">${a ? avatarHTML(a, 38) : `<img src="${LOGO_DEFAULT}" alt="">`}</div>
        <div class="brand">
          <div class="club-name">${esc(a ? a.nome : "La mia area")}</div>
          ${a ? `<div class="club-sub">La mia area</div>` : ""}
        </div>
        <div class="spacer"></div>
        ${rolePillHTML(r)}`;
    }
    case "categoria": case "diario": {
      const cat = getCat(VIEW.name === "diario" ? VIEW.cat : VIEW.id);
      return back({ name: "categorie" }, "", "Categoria · " + (cat ? cat.fascia : ""));
    }
    case "allenatore": {
      const a = S.allenatori.find(x => x.id === VIEW.id);
      return back({ name: "allenatori" }, a ? a.nome : "Allenatore");
    }
    case "partita": {
      // per i tornei il nome della manifestazione sta in `avversario` (come nei dati)
      const p = S.partite.find(x => x.id === VIEW.id);
      return back({ name: "partite" }, p ? p.avversario : "Partita");
    }
    case "evento": {
      const e = S.eventi.find(x => x.id === VIEW.id);
      return back({ name: "eventi" }, e ? e.nome : "Evento");
    }
    default:
      // schermate principali: scudo + nome del club, senza sottotitolo (come nel mockup)
      return `
        ${MENU_BTN}
        <div class="logo"><img src="${S.settings.logo || LOGO_DEFAULT}" alt="Stemma ${esc(S.settings.club)}"></div>
        <div class="brand">
          <div class="club-name">${esc(S.settings.club)}</div>
        </div>
        <div class="spacer"></div>
        ${rolePillHTML(r)}`;
  }
}
/* intestazione, ruolo e menu: si aggiornano anche mentre si carica,
   così durante lo scheletro la sezione attiva è già quella giusta */
function renderChrome() {
  applyTheme();
  renderLogo();

  // i Genitori (L5) vedono solo Home, Categorie, Partite, Eventi e Contatti — "mio" resta
  // raggiungibile anche per loro (in versione ridotta, vedi vMio) perché è l'unica via per
  // tornare a un altro livello: senza questa eccezione, una volta scelto L5 dal pallino
  // dell'intestazione non si poteva più uscirne.
  if (VIEW.name !== "mio" && !canSee(NAV_PARENT[VIEW.name] || "home")) VIEW = { name: "home" };
  if (VIEW.name === "diario" && !vedeDiario()) VIEW = { name: "categoria", id: VIEW.cat };
  const r = ruoloCorrente();
  document.getElementById("topbarMain").innerHTML = headerMainHTML(r);
  const parent = NAV_PARENT[VIEW.name] || "home";
  const spettatore = ruoloCorrente().livello === 5;
  const stileMenu = S.settings.menu || "classico";
  document.documentElement.setAttribute("data-menu", stileMenu);
  misuraTopbar();
  // solo il menu classico raggruppa le sezioni secondarie sotto "Altro" (max 5 voci in basso)
  const usaAltro = stileMenu === "classico" && !spettatore;
  // design system: barra diretta con Home, Categorie, Tornei, Eventi, Altro;
  // Allenatori passa dentro "Altro" insieme a Mio/Contatti/Impostazioni.
  const GRUPPO_ALTRO = ["mio", "allenatori", "contatti", "impostazioni"];
  document.querySelectorAll("#nav button").forEach(b => {
    const v = b.dataset.view;
    if (v === "altro") {
      b.classList.toggle("hide-role", !usaAltro);
      b.classList.toggle("on", usaAltro && GRUPPO_ALTRO.includes(parent));
      return;
    }
    b.classList.toggle("hide-role", !canSee(v));
    b.classList.toggle("mob-hide", usaAltro && GRUPPO_ALTRO.includes(v));
    b.classList.toggle("on", v === parent);
  });
}

function render() {
  clearTimeout(_attesa);            // se stavamo aspettando, il contenuto vero ha la precedenza
  renderChrome();

  const main = document.getElementById("main");
  main.removeAttribute("aria-busy");
  const views = {
    home: vHome,
    mio: vMio,
    categorie: vCategorie,
    categoria: () => vCategoria(VIEW.id),
    diario: () => vDiario(VIEW.cat, VIEW.tipo),
    allenatori: vAllenatori,
    allenatore: () => vAllenatore(VIEW.id),
    partite: vPartite,
    partita: () => vPartita(VIEW.id),
    eventi: vEventi,
    evento: () => vEvento(VIEW.id),
    contatti: vContatti,
    impostazioni: vImpostazioni
  };
  main.innerHTML = (views[VIEW.name] || vHome)();
  _nuovoId = null;   // letta durante la riga sopra: un solo render con l'animazione di entrata
  // anima al cambio di schermata, non a ogni modifica — con un'eccezione: chi sceglie il
  // proprio profilo in "La mia area" resta sulla stessa vista ("mio") ma tutto il contenuto
  // cambia di colpo (da "Chi sei?" all'intera scheda personale); _forzaAnim la fa entrare
  // con la stessa dissolvenza, invece di comparire di scatto.
  if (render._ultimaVista !== VIEW.name || _forzaAnim) {
    main.classList.remove("anim");
    void main.offsetWidth;
    main.classList.add("anim");
    _forzaAnim = false;
  }
  render._ultimaVista = VIEW.name;
  bindCharts(main);
  bindLongText(main);
  bindImgSk(main);

  const rs = document.getElementById("roleSwitch");
  if (rs) rs.addEventListener("change", () => { S.ruoloCorrente = rs.value; save(); render(); toast("Ora vedi l'app come: " + ruoloCorrente().nome); });
  const ts = document.getElementById("themeSwitch");
  if (ts) ts.addEventListener("change", () => { S.settings.tema = ts.value; save(); applyTheme(); });
  const ms = document.getElementById("menuSwitch");
  if (ms) ms.addEventListener("change", () => {
    S.settings.menu = ms.value; save(); chiudiTendina(); render();
    toast(ms.value === "tendina" ? "Menu a tendina: tocca l'icona in alto a sinistra"
        : ms.value === "alto" ? "Menu in barra sotto l'intestazione" : "Menu classico");
  });
  const sks = document.getElementById("skSwitch");
  if (sks) sks.addEventListener("change", () => {
    S.settings.provaCaricamento = Number(sks.value) || 0; save();
    toast(S.settings.provaCaricamento
      ? "Prova attiva: cambia sezione per vedere i segnaposto"
      : "Prova spenta: le schermate compaiono subito");
  });
  const lf = document.getElementById("logoFile");
  if (lf) lf.addEventListener("change", () => {
    const f = lf.files[0];
    if (!f) return;
    if (f.size > 1.5 * 1024 * 1024) { toast("Immagine troppo grande (max 1,5 MB)"); return; }
    const rd = new FileReader();
    rd.onload = () => { S.settings.logo = rd.result; save(); render(); toast("Logo aggiornato"); };
    rd.readAsDataURL(f);
  });
  const pf = document.getElementById("posterFile");
  if (pf) pf.addEventListener("change", () => {
    const f = pf.files[0];
    if (!f) return;
    readImageFile(f, 1100, dataUri => {
      const e = S.eventi.find(x => x.id === VIEW.id);
      if (e) { e.locandina = dataUri; save(); render(); toast("Locandina caricata"); }
    });
  });
  const cf = document.getElementById("coachFotoFile");
  if (cf) cf.addEventListener("change", () => {
    const f = cf.files[0];
    if (!f) return;
    readImageFile(f, 420, dataUri => {
      const a = getCoach(cf.dataset.coach);
      if (a) { a.foto = dataUri; save(); render(); toast("Foto aggiornata"); }
    });
  });
  const imf = document.getElementById("importFile");
  if (imf) imf.addEventListener("change", () => {
    const f = imf.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const d = JSON.parse(rd.result);
        if (!d || d.version !== 1 || !Array.isArray(d.categorie)) throw new Error("formato");
        S = migrate(d);   // i backup di versioni vecchie ricevono i campi aggiunti dopo
        save(); go({ name: "home" }); toast("Backup caricato");
      } catch (e) { toast("File non valido: serve un backup esportato da quest'app"); }
    };
    rd.readAsText(f);
  });
}

/* altezza dell'intestazione: serve a posizionare tendina e barra in alto */
function misuraTopbar() {
  const h = document.querySelector(".topbar").offsetHeight;
  if (h) document.documentElement.style.setProperty("--topbar-h", h + "px");
}
addEventListener("resize", misuraTopbar);

/* menu a tendina: si apriva animato ma si chiudeva di scatto (rimuoveva "open", che porta
   display:none, subito). Stesso schema già usato per il modale: un'uscita animata prima di
   sparire davvero, con un timer da annullare se si riapre nel frattempo. */
let _tendinaTimer = null;
function chiudiTendina() {
  const nav = document.getElementById("nav");
  document.getElementById("menuBtn")?.setAttribute("aria-expanded", "false");
  if (!nav.classList.contains("open")) return;
  nav.classList.remove("open");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  nav.classList.add("closing");
  clearTimeout(_tendinaTimer);
  _tendinaTimer = setTimeout(() => nav.classList.remove("closing"), 130);
}
ACT.toggleTendina = (arg, el, e) => {
  e.stopPropagation();
  const nav = document.getElementById("nav");
  if (nav.classList.contains("open")) { chiudiTendina(); return; }   // stessa uscita animata
  clearTimeout(_tendinaTimer);
  nav.classList.remove("closing");
  nav.classList.add("open");
  document.getElementById("menuBtn")?.setAttribute("aria-expanded", "true");
};
document.addEventListener("click", e => {
  const nav = document.getElementById("nav");
  if (nav.classList.contains("open") && !nav.contains(e.target) && !e.target.closest("#menuBtn")) chiudiTendina();
});

/* pannello "Altro" (mobile) */
function openAltro() {
  const voci = [
    { v: "mio", t: "La mia area", d: "Le tue presenze e i prossimi impegni", icona: "user" },
    { v: "allenatori", t: "Allenatori", d: "Schede, contratti e presenze staff", icona: "users" },
    { v: "contatti", t: "Contatti", d: "Rubrica società e staff", icona: "phone" },
    { v: "impostazioni", t: "Ruoli e impostazioni", d: "Permessi, tema, logo, backup", icona: "gear" }
  ].filter(x => canSee(x.v));
  MODAL = { altro: true };
  document.getElementById("modalRoot").innerHTML = `
  <div class="modal-veil" data-veil="1">
    <div class="modal" role="dialog" aria-modal="true" aria-label="Altre sezioni">
      <div class="row">
        <h3 class="grow">Altre sezioni</h3>
        <button class="iconbtn" data-close="1" aria-label="Chiudi">${ic("x")}</button>
      </div>
      ${voci.map(x => `
        <button class="altro-item" data-act="altroGo" data-arg="${x.v}">
          ${ic(x.icona)}
          <span>${esc(x.t)}<span class="d">${esc(x.d)}</span></span>
        </button>`).join("")}
    </div>
  </div>`;
  const veil = document.querySelector("#modalRoot .modal-veil");
  veil.addEventListener("click", e => { if (e.target.dataset.veil) closeModal(); });
  veil.querySelector("[data-close]").addEventListener("click", closeModal);
}
ACT.altroGo = v => { closeModal(); go({ name: v }); };

/* nav */
document.getElementById("nav").addEventListener("click", e => {
  const b = e.target.closest("button[data-view]");
  if (!b) return;
  chiudiTendina();
  if (b.dataset.view === "altro") openAltro();
  else go({ name: b.dataset.view });
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (MODAL) closeModal();
  chiudiTendina();
});

/* Parallasse della filigrana (design system): lo scudo di sfondo scorre al 20% della
   velocità del contenuto. L'elemento è fisso (quindi fermo a 0%), perciò lo spostiamo
   di -20% dello scorrimento per ottenere quella velocità apparente. */
const WM_PARALLASSE = 0.30;
function avviaParallasse() {
  if (matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const wm = document.getElementById("watermark");
  if (!wm) return;
  let inCoda = false;
  const aggiorna = () => {
    inCoda = false;
    wm.style.setProperty("--wm-y", (-scrollY * WM_PARALLASSE).toFixed(1) + "px");
  };
  addEventListener("scroll", () => {
    if (inCoda) return;
    inCoda = true;
    requestAnimationFrame(aggiorna);
  }, { passive: true });
  aggiorna();
}
avviaParallasse();

/* avvio: se l'URL contiene già una schermata (deep link), riaprila */
if (location.hash) VIEW = hashToView(location.hash);
go(VIEW);
</script>
